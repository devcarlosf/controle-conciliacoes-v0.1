<html lang="pt-BR" data-theme="dark"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Conciliações</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  :root, [data-theme="dark"] {
    --bg: #10171C;
    --bg-deep: #0C1216;
    --surface: #16232B;
    --surface-2: #131C21;
    --border: #223038;
    --border-strong: #2B3A44;
    --hover-bg: #1C2C35;
    --text-primary: #F3F5F8;
    --text-strong: #FFFFFF;
    --text-secondary: #E4E8ED;
    --text-muted: #B4BCC6;
    --text-label: #A2ABB6;
    --accent: #1AA6D6;
    --accent-hover: #29B8E8;
    --accent-border: #22B8E0;
    --accent-soft: #4FC3E8;
    --accent-text-on: #062430;
    --overlay-03: rgba(255,255,255,.03);
    --overlay-05: rgba(255,255,255,.05);
    --overlay-045: rgba(255,255,255,.045);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #F2F4F6;
    --bg-deep: #E7EBEE;
    --surface: #FFFFFF;
    --surface-2: #F6F8F9;
    --border: #DEE3E7;
    --border-strong: #C7CED4;
    --hover-bg: #EEF3F6;
    --text-primary: #0B1116;
    --text-strong: #050A0E;
    --text-secondary: #232A31;
    --text-muted: #4E5862;
    --text-label: #414A54;
    --accent: #0F86AF;
    --accent-hover: #0C6F92;
    --accent-border: #0F86AF;
    --accent-soft: #0E7CA3;
    --accent-text-on: #FFFFFF;
    --overlay-03: rgba(0,0,0,.03);
    --overlay-05: rgba(0,0,0,.045);
    --overlay-045: rgba(0,0,0,.04);
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
  }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 24px 20px 60px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 24px; font-weight: 600; margin: 0; color: var(--text-primary); }
  .header p { font-size: 14px; margin: 4px 0 0; color: var(--accent-soft); }
  .save-indicator { font-size: 12px; color: var(--text-muted); min-width: 90px; text-align: right; }
  .save-indicator.saved { color: #5DCAA5; }

  /* Buttons */
  button { font-family: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 500; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  .btn:hover { background: var(--hover-bg); border-color: var(--accent-border); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text-on); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { background: transparent; border: none; color: var(--accent-soft); padding: 4px 8px; cursor: pointer; transition: color .15s; }
  .btn-ghost:hover { color: #fff; }
  .btn-danger-ghost { background: transparent; border: none; color: #F87171; padding: 4px 8px; cursor: pointer; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Home: group cards */
  .toolbar-home { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
  .search-input { flex: 1 1 260px; }
  .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; text-align: left; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .group-card:hover { border-color: var(--accent-border); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.22); }
  .group-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .group-card .sub { font-size: 12px; color: var(--text-label); margin-bottom: 12px; }
  .group-card .bars { display: flex; height: 6px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; background: var(--bg); }
  .group-card .bars > div { height: 100%; }
  .group-card .stats { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--text-secondary); }
  .group-card .stats span.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13.5px; line-height: 1.6; }

  /* Summary cards */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.12); transition: border-color .15s, transform .15s; }
  .summary-card:hover { border-color: var(--border-strong); }
  .summary-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .summary-card .label { color: var(--text-label); font-size: 11.5px; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .02em; }
  .summary-card .value { font-size: 22px; font-weight: 700; line-height: 1.1; }

  /* Quick filters */
  .quick-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .quick-filter-chip { background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: all .15s; font-family: inherit; }
  .quick-filter-chip b { font-weight: 700; margin-left: 3px; }
  .quick-filter-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .quick-filter-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text-on); }

  /* Quick "hoje" date fill */
  .date-edit-cell { display: flex; align-items: center; gap: 6px; }
  .mini-today-btn { background: var(--hover-bg); border: 1px solid var(--border-strong); color: var(--text-secondary); font-size: 10.5px; font-weight: 600; padding: 6px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .mini-today-btn:hover { color: var(--text-primary); border-color: var(--accent-border); }

  /* Detail view */
  .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text-label); font-size: 13px; }
  .breadcrumb a { color: var(--accent-soft); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
  input[type=text], input[type=url], input[type=password], select, textarea {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; color: var(--text-primary);
    font-size: 13px; padding: 8px 10px; outline: none; font-family: inherit;
  }
  input[type=text]:focus, input[type=url]:focus, select:focus, textarea:focus { border-color: var(--accent-border); }
  input[type=text] { width: 100%; }
  option { background: var(--surface); color: var(--text-primary); }
  ::placeholder { color: var(--text-muted); }

  .count-line { color: var(--text-muted); font-size: 12px; margin: 0 0 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; overflow-y: visible; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  thead { position: sticky; top: 0; z-index: 5; }
  thead tr { background: var(--bg-deep); }
  th { text-align: left; padding: 10px 14px; color: var(--text-label); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .filter-row { background: var(--bg); }
  .filter-row th { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .col-filter { width: 100%; min-width: 100px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 5px; color: var(--text-secondary); font-size: 12px; padding: 5px 6px; outline: none; }
  .col-filter:focus { border-color: var(--accent-border); }
  .col-filter.active { border-color: var(--accent-border); background: var(--hover-bg); color: var(--text-primary); }
  td { padding: 10px 14px; color: var(--text-secondary); vertical-align: top; }
  tbody tr { border-top: 1px solid var(--border); transition: background .1s; }
  tbody tr:nth-child(even) { background: var(--surface-2); }
  tbody tr:nth-child(odd) { background: var(--surface); }
  tbody tr:hover { background: var(--hover-bg); }
  tbody tr.editing { background: var(--hover-bg); }
  .empresa-cell { color: var(--text-primary); font-weight: 500; }
  .obs-display { color: var(--text-secondary); white-space: pre-wrap; max-width: 260px; max-height: 90px; overflow-y: auto; display: block; }

  .badge { border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; display: inline-block; }

  .row-actions { white-space: nowrap; }

  .edit-obs { width: 240px; min-height: 70px; resize: vertical; }
  .edit-input { width: 130px; }
  .edit-input.wide { width: 150px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 24px; width: 380px; max-width: 90vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .modal h3 { margin: 0 0 16px; font-size: 16px; color: var(--text-primary); }
  .modal label { display: block; font-size: 12px; color: var(--text-label); margin: 12px 0 6px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .modal input[type=text], .modal input[type=url], .modal input[type=password], .modal textarea { width: 100%; }

  /* Pinned / weekly highlight */
  .group-card { position: relative; }
  .group-card.pinned { border-color: #F0B93E; box-shadow: 0 0 0 1px #F0B93E, 0 4px 18px rgba(240,185,62,.14); background: linear-gradient(180deg, #262112 0%, var(--surface) 55%); }
  .group-card.pinned:hover { border-color: #F5CB63; }
  .pin-btn { position: absolute; top: 10px; right: 10px; background: transparent; border: none; font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; color: var(--text-muted); cursor: pointer; transition: color .15s, background .15s; }
  .pin-btn:hover { background: rgba(240,185,62,.12); color: #F0B93E; }
  .pin-btn.active { color: #F0B93E; }
  .weekly-badge { display: inline-flex; align-items: center; gap: 6px; background: #F0B93E; color: #2B1E00; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; text-transform: uppercase; }
  .weekly-badge .badge-edit { background: transparent; border: none; color: #2B1E00; opacity: .65; cursor: pointer; padding: 0; font-size: 11px; line-height: 1; }
  .weekly-badge .badge-edit:hover { opacity: 1; }
  .group-card .name { padding-right: 88px; display: block; }
  .gear-btn { position: absolute; top: 10px; right: 40px; background: transparent; border: none; font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 6px; color: var(--text-label); cursor: pointer; transition: color .15s, background .15s; }
  .gear-btn:hover { background: rgba(130,138,148,.15); color: var(--text-primary); }
  .trash-btn { position: absolute; top: 10px; right: 70px; background: transparent; border: none; font-size: 14px; line-height: 1; padding: 4px 6px; border-radius: 6px; color: var(--text-label); cursor: pointer; transition: color .15s, background .15s; }
  .trash-btn:hover { background: rgba(239,68,68,.15); color: #F87171; }
  .group-card .desc { font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; white-space: pre-wrap; }
  .group-card .report-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--accent-soft); background: rgba(139,150,163,.10); border: 1px solid var(--border-strong); border-radius: 5px; padding: 4px 8px; margin-top: 8px; cursor: pointer; }
  .group-card .report-btn:hover { background: rgba(139,150,163,.20); color: #fff; }
  .password-row { display: flex; gap: 6px; align-items: center; }
  .password-row input { flex: 1; font-family: ui-monospace, monospace; }
  .copy-btn { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 5px; color: var(--text-secondary); font-size: 12px; padding: 6px 10px; cursor: pointer; }
  .copy-btn:hover { background: var(--hover-bg); }
  input[type=date] { background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; color: var(--text-primary); font-size: 13px; padding: 7px 8px; outline: none; font-family: inherit; }
  input[type=date]:focus { border-color: var(--accent-border); }

  /* --- Destaque para datas, observações e categorias --- */
  .date-highlight {
    display: inline-block;
    background: rgba(79,195,232,.22);
    border: 1px solid rgba(79,195,232,.62);
    border-radius: 5px;
    padding: 3px 9px;
    color: #F1FAFE;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    box-shadow: inset 0 0 0 1px rgba(79,195,232,.10);
  }
  [data-theme="light"] .date-highlight { background: rgba(15,134,175,.14); border-color: rgba(15,134,175,.55); color: #073448; }
  .obs-editable, textarea.obs-editable {
    width: 240px;
    min-height: 60px;
    resize: vertical;
    border-left: 4px solid #FBBF24;
    background: rgba(245,158,11,.10);
    color: var(--text-primary);
    padding-left: 10px;
    font-weight: 500;
  }
  .obs-editable:focus { background: rgba(245,158,11,.18); border-color: var(--accent-border); border-left-color: #FCD34D; }
  .obs-display { border-left: 4px solid #FBBF24; background: rgba(245,158,11,.10); padding: 6px 10px; border-radius: 4px; color: var(--text-primary); font-weight: 500; }

  /* Category chips & badges */
  .cat-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
  .cat-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-secondary); font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 16px; cursor: pointer; font-family: inherit; transition: all .12s; }
  .cat-chip:hover { color: var(--text-primary); border-color: var(--accent-border); }
  .cat-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text-on); font-weight: 600; }
  .cat-chip b { font-weight: 700; opacity: .85; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .cat-badge { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap; }
  .banco-wrap { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .banco-name { font-weight: 600; color: var(--text-primary); }
  .banco-edit-wrap { display: flex; flex-direction: column; gap: 6px; }
  .banco-edit-wrap .cat-select { max-width: 200px; }
  .cat-manager-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 320px; overflow-y: auto; }
  .cat-row { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .cat-row .cat-count { color: var(--text-muted); font-size: 11.5px; margin-left: auto; }

  /* Reforço em valores e nomes */
  .summary-card .value { font-weight: 700 !important; font-size: 20px !important; letter-spacing: -.01em; }
  .empresa-cell { color: var(--text-primary); font-weight: 600; }
  table td { color: var(--text-primary); }
  table th { color: var(--text-strong); font-weight: 700; letter-spacing: .02em; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 18px 0 16px; }
  .tab { background: transparent; border: none; color: var(--text-label); font-size: 13px; font-weight: 500; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text-secondary); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--accent-border); }

  /* Type tag */
  .type-tag { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
  .type-tag.americano { background: rgba(26,166,214,.15); color: var(--accent-soft); border: 1px solid rgba(26,166,214,.35); }
  .type-tag.controladoria { background: rgba(16,185,129,.15); color: #34D399; border: 1px solid rgba(16,185,129,.30); }
  .group-card .type-tag { margin-left: 0; margin-bottom: 6px; }

  /* Type radio inside settings modal */
  .type-radio { display: flex; gap: 8px; }
  .type-radio label { flex: 1; margin: 0 !important; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg); border-radius: 6px; padding: 10px 12px; color: var(--text-secondary); font-size: 13px; display: flex; align-items: flex-start; gap: 8px; }
  .type-radio label.selected { border-color: var(--accent-border); background: var(--hover-bg); color: var(--text-primary); }
  .type-radio input { margin-top: 3px; }
  .type-radio .k { display: block; font-weight: 600; margin-bottom: 2px; }
  .type-radio .d { display: block; font-size: 11px; color: var(--text-label); }

  /* Access cards */
  .access-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .access-item-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .access-item-title h4 { margin: 0; font-size: 14px; color: var(--text-primary); }
  .access-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .access-field { display: flex; flex-direction: column; gap: 4px; }
  .access-field .k { font-size: 10px; text-transform: uppercase; color: var(--text-label); letter-spacing: .05em; font-weight: 600; }
  .access-field .v { display: flex; gap: 6px; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 6px 10px; font-size: 12px; color: var(--text-primary); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; min-height: 30px; }
  .access-field .v .val { flex: 1; word-break: break-all; white-space: pre-wrap; }
  .access-field.obs .v { font-family: inherit; }
  .mini-copy { background: transparent; border: 1px solid transparent; color: var(--accent-soft); cursor: pointer; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  .mini-copy:hover { background: rgba(139,150,163,.15); color: #fff; border-color: var(--border-strong); }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* Sortable headers */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text-primary); }
  th.sortable .sort-arrow { color: var(--accent-border); margin-left: 3px; }

  /* Histórico */
  .snapshot-table-wrap { max-height: 60vh; overflow: auto; }

  /* Status dropdown (Situação) */
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .status-dropdown-wrap { position: relative; display: inline-block; }
  .status-trigger { display: inline-flex; align-items: center; gap: 7px; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; border: 1px solid; cursor: pointer; font-family: inherit; line-height: 1.3; }
  .status-trigger:hover { filter: brightness(1.04); }
  .status-caret { font-size: 8px; opacity: .6; margin-left: 1px; }
  .status-popover { position: absolute; top: calc(100% + 5px); left: 0; background: var(--surface); border: 1px solid #2E3542; border-radius: 8px; padding: 5px; min-width: 195px; box-shadow: 0 10px 28px rgba(0,0,0,.4); z-index: 25; }
  .status-option { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: transparent; border: none; color: var(--text-secondary); font-size: 12px; padding: 7px 9px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .status-option:hover { background: var(--hover-bg); color: var(--text-strong); }
  .status-option.active { background: rgba(26,166,214,.16); color: var(--text-strong); font-weight: 600; }

  /* Lembretes de documentos */
  .home-panels { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: start; margin-bottom: 20px; }
  @media (max-width: 900px) { .home-panels { grid-template-columns: 1fr; } }

  .cal-item.status-atrasado { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.55); color: #FCA5A5; }

  .cal-item.status-pendente { background: rgba(139,150,163,.14); border-color: var(--border-strong); color: var(--text-secondary); }

  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--text-muted); }
  .cal-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--border-strong); }
  @media (max-width: 640px) { .cal-cell { min-height: 70px; } .cal-item { font-size: 9.5px; } }

  /* =====================================================================
     Interface moderna (v2): botões, modais, listas, mensagens, responsivo

  .btn { border-radius: 10px; padding: 9px 15px; letter-spacing: .01em; }

  .import-resumo .k { font-size: 11px; color: var(--text-label); text-transform: uppercase; letter-spacing: .04em; }

<body>
<div class="wrap" id="app"></div>
<script>
/* =========================================================================
 * ARMAZENAMENTO (localStorage)
 * Toda a aplicação grava em UMA única chave, com a estrutura:
 *
 *   {
 *     versao: 3,
 *     empresa:       [ { id, nome, grupo, criadoEm } ],      // cadastro
 *     configuracao:  { settings, categorias, modelos },       // preferências
 *     conciliacoes:  { [empresa]: [ lançamentos ] },          // por empresa
 *     historico:     { [chave]:   [ competências arquivadas ] },
 *     arquivos:      { [chave]:   [ acessos/credenciais ] },
 *     dashboard:     { pinned, labels, badges, descricoes,
 *                      relatorios, tipos, lembretes, categoriasPorLinha }
 *   }
 *
 * O sistema inicia SEM nenhum dado. Nada é gravado automaticamente antes
 * de o usuário cadastrar a primeira empresa.
 * ====================================================================== */
const DB_KEY = "conciliacoes:v3";
const BACKUP_KEY = "conciliacoes:v3:backup";
const DEFAULT_CATEGORIES = [];

/** Estrutura vazia — usada no primeiro acesso e ao limpar o sistema. */
function emptyDb() {
  return {
    versao: 3,
    empresa: [],
    configuracao: { settings: defaultSettings(), categorias: [], modelos: [], modelosImportacao: [] },
    conciliacoes: {},
    historico: {},
    arquivos: {},
    importacoes: {},
    dashboard: { pinned: [], labels: {}, badges: {}, descricoes: {}, relatorios: {}, tipos: {}, lembretes: {}, categoriasPorLinha: {} },
  };
}
function defaultSettings() {
  return { theme: "dark", antecedenciaPadrao: 3, agingAmarelo: 14, agingVermelho: 30 };
}
let empresasCadastro = []; // [{ id, nome, grupo, criadoEm }]
let pinned = new Set();
let customLabels = {};
let customBadges = {};
let customDescriptions = {};
let reports = {};
let customTypes = {}; // key -> "americano" | "controladoria"
let accesses = {};    // key -> [{ id, banco, usuario, senha, agencia, conta, codigos, observacoes }]
let historico = {};   // key -> [{ id, label, archivedAt, cols, rows }]
let reminders = {};   // key -> [{ id, documento, frequencia, diaMes, dataUnica, antecedenciaDias, observacao, ativo, status, statusCycle }]
let templates = [];   // [{ id, nome, categoria, texto }]
let importacoes = {};   // key -> [{ id, nome, formato, importadoEm, resumo, lancamentos }]
let importModels = [];  // [{ id, nome, mapa, assinatura }] modelos de importação salvos
let bankCategories = {}; // rowId -> category name
let categoryList = []; // available categories
let categoryFilter = ""; // active filter (empty = all)
let categoryManagerOpen = false;
let settings = { theme: "dark", antecedenciaPadrao: 3, agingAmarelo: 14, agingVermelho: 30 };
// Estado do calendário/central
let calendarView = { open: false, year: null, month: null, filterGroup: "", filterStatus: "" };
const SITUACOES = ["Totalmente conciliado", "Parcialmente conciliado", "Sem movimentação", "Pendente"];
const MESES_PT = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];


// ---------- state ----------
let rows = [];
let view = { type: "home" };
let search = "";
let groupSearch = "";
let activeTab = "conciliacoes";
let columnFilters = { empresa: "", banco: "", saldo_batendo: "", data_conciliado: "", data_envio: "", competencia: "", situacao: "", observacao: "" };
let sortField = null;
let sortDir = "asc";
let openStatusId = null;
let homeTab = "painel";
let bulkDateEdit = false;
let bulkDraft = {};
let homeGroupFilter = "";
let homeTypeFilter = "";
let agingIncludeControladoria = false;
let saveTimer = null;

const COLUMNS_AMERICANO = [
  { field: "empresa", label: "Empresa" },
  { field: "banco", label: "Banco" },
  { field: "saldo_batendo", label: "Saldo batendo" },
  { field: "data_conciliado", label: "Data conciliado" },
  { field: "competencia", label: "Competência" },
  { field: "situacao", label: "Situação" },
  { field: "observacao", label: "Observação" }
];
const COLUMNS_CONTROLADORIA = [
  { field: "empresa", label: "Empresa" },
  { field: "banco", label: "Banco" },
  { field: "data_envio", label: "Data de envio" },
  { field: "situacao", label: "Situação" },
  { field: "observacao", label: "Observação" }
];
const DATE_FIELDS = new Set(["saldo_batendo", "data_conciliado", "data_envio"]);

// ---------- storage ----------

/** Lê o banco completo do localStorage (sem nunca gravar nada). */
function readDb() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return emptyDb();
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" ? Object.assign(emptyDb(), parsed) : emptyDb();
  } catch (e) {
    return emptyDb();
  }
}

/** Grava o banco completo. */
function writeDb(db) {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    showSaved();
    return true;
  } catch (e) {
    notify("Não foi possível salvar (armazenamento cheio).", "erro");
    return false;
  }
}

/** Carrega o banco para o estado em memória da aplicação. */
function loadAll() {
  const db = readDb();
  hydrate(db);
}

/** Distribui a estrutura do banco nas variáveis de estado. */
function hydrate(db) {
  db = Object.assign(emptyDb(), db || {});
  empresasCadastro = Array.isArray(db.empresa) ? db.empresa : [];

  // Conciliações separadas por empresa -> lista única em memória
  rows = [];
  Object.keys(db.conciliacoes || {}).forEach((empresa) => {
    (db.conciliacoes[empresa] || []).forEach((r) => rows.push(Object.assign({}, r, { empresa })));
  });
  rows.sort((a, b) => (a.id || 0) - (b.id || 0));

  const cfg = db.configuracao || {};
  settings = Object.assign(defaultSettings(), cfg.settings || {});
  categoryList = Array.isArray(cfg.categorias) ? cfg.categorias.slice() : [];
  templates = Array.isArray(cfg.modelos) ? cfg.modelos.slice() : [];
  importModels = Array.isArray(cfg.modelosImportacao) ? cfg.modelosImportacao.slice() : [];
  importacoes = db.importacoes || {};

  historico = db.historico || {};
  accesses = db.arquivos || {};

  const dash = db.dashboard || {};
  pinned = new Set(Array.isArray(dash.pinned) ? dash.pinned : []);
  customLabels = dash.labels || {};
  customBadges = dash.badges || {};
  customDescriptions = dash.descricoes || {};
  reports = dash.relatorios || {};
  customTypes = dash.tipos || {};
  bankCategories = dash.categoriasPorLinha || {};
  reminders = dash.lembretes || {};
  Object.keys(reminders).forEach((k) => {
    (reminders[k] || []).forEach((r) => {
      if (r.status === undefined) r.status = r.concluido ? "recebido" : "pendente";
      if (r.antecedenciaDias === undefined) r.antecedenciaDias = settings.antecedenciaPadrao;
      if (r.statusCycle === undefined) r.statusCycle = null;
    });
  });
}

/** Monta a estrutura do banco a partir do estado em memória. */
function snapshotDb() {
  const conciliacoes = {};
  rows.forEach((r) => {
    const empresa = r.empresa || "(sem empresa)";
    (conciliacoes[empresa] = conciliacoes[empresa] || []).push(r);
  });
  return {
    versao: 3,
    empresa: empresasCadastro,
    configuracao: { settings, categorias: categoryList, modelos: templates, modelosImportacao: importModels },
    conciliacoes,
    historico,
    arquivos: accesses,
    importacoes,
    dashboard: {
      pinned: Array.from(pinned),
      labels: customLabels,
      badges: customBadges,
      descricoes: customDescriptions,
      relatorios: reports,
      tipos: customTypes,
      lembretes: reminders,
      categoriasPorLinha: bankCategories,
    },
  };
}

/** Persiste TODO o estado atual. Função única usada por toda a aplicação. */
function persist() { return writeDb(snapshotDb()); }

// Aliases mantidos por compatibilidade com o restante do código.
const saveData = persist;
const savePinned = persist;
const saveLabels = persist;
const saveBadges = persist;
const saveDescriptions = persist;
const saveReports = persist;
const saveTypes = persist;
const saveAccesses = persist;
const saveHistorico = persist;
const saveReminders = persist;
const saveSettings = persist;

// ---------- categorias ----------
function getRowCategory(id) { return bankCategories[id] || ""; }
function setRowCategory(id, cat) {
  if (cat) bankCategories[id] = cat; else delete bankCategories[id];
  saveBankCategories();
}
function categoryColor(cat) {
  // deterministic color from name
  const palette = [
    { bg: "rgba(79,195,232,.16)", bd: "rgba(79,195,232,.55)", tx: "#7FD5F0" },
    { bg: "rgba(52,211,153,.16)", bd: "rgba(52,211,153,.55)", tx: "#5DDBAA" },
    { bg: "rgba(251,191,36,.16)", bd: "rgba(251,191,36,.55)", tx: "#FCD34D" },
    { bg: "rgba(167,139,250,.18)", bd: "rgba(167,139,250,.55)", tx: "#C4B5FD" },
    { bg: "rgba(244,114,182,.16)", bd: "rgba(244,114,182,.55)", tx: "#F9A8D4" },
    { bg: "rgba(248,113,113,.16)", bd: "rgba(248,113,113,.55)", tx: "#FCA5A5" },
    { bg: "rgba(56,189,248,.16)", bd: "rgba(56,189,248,.55)", tx: "#7DD3FC" },
  ];
  if (!cat) return palette[0];
  let h = 0; for (let i=0;i<cat.length;i++) h = (h*31 + cat.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}
function renderCategoryBadge(cat) {
  if (!cat) return "";
  const c = categoryColor(cat);
  return `<span class="cat-badge" style="background:${c.bg};border-color:${c.bd};color:${c.tx}">${esc(cat)}</span>`;
}
function openCategoryManager() { categoryManagerOpen = true; render(); }
function closeCategoryManager() { categoryManagerOpen = false; render(); }
function addCategory() {
  const name = (prompt("Nome da nova categoria:") || "").trim();
  if (!name) return;
  if (categoryList.includes(name)) { alert("Categoria já existe."); return; }
  categoryList.push(name);
  saveCategoryList();
  render();
}
function renameCategory(oldName) {
  const name = (prompt("Novo nome:", oldName) || "").trim();
  if (!name || name === oldName) return;
  if (categoryList.includes(name)) { alert("Categoria já existe."); return; }
  categoryList = categoryList.map(c => c === oldName ? name : c);
  Object.keys(bankCategories).forEach(id => { if (bankCategories[id] === oldName) bankCategories[id] = name; });
  saveCategoryList(); saveBankCategories();
  if (categoryFilter === oldName) categoryFilter = name;
  render();
}
function removeCategory(name) {
  if (!confirm(`Remover a categoria "${name}"? Os itens marcados com ela ficarão sem categoria.`)) return;
  categoryList = categoryList.filter(c => c !== name);
  Object.keys(bankCategories).forEach(id => { if (bankCategories[id] === name) delete bankCategories[id]; });
  saveCategoryList(); saveBankCategories();
  if (categoryFilter === name) categoryFilter = "";
  render();
}
function setCategoryFilter(cat) { categoryFilter = (categoryFilter === cat) ? "" : cat; render(); }
function onRowCategoryChange(id, value) {
  setRowCategory(id, value);
  if (draft && draft.id === id) draft._category = value;
  render();
}

function renderCategoryFilterBar(rows) {
  const counts = {};
  let uncategorized = 0;
  rows.forEach(r => {
    const c = getRowCategory(r.id);
    if (c) counts[c] = (counts[c] || 0) + 1;
    else uncategorized++;
  });
  const chips = [];
  chips.push(`<button class="cat-chip ${!categoryFilter ? "active" : ""}" onclick="setCategoryFilter('')">Todas <b>${rows.length}</b></button>`);
  categoryList.forEach(cat => {
    const n = counts[cat] || 0;
    const c = categoryColor(cat);
    const active = categoryFilter === cat;
    chips.push(`<button class="cat-chip" style="${active ? `background:${c.bg};border-color:${c.bd};color:${c.tx};` : ""}" onclick="setCategoryFilter('${jsq(cat)}')"><span class="cat-dot" style="background:${c.tx}"></span>${esc(cat)} <b>${n}</b></button>`);
  });
  if (uncategorized) {
    chips.push(`<button class="cat-chip ${categoryFilter === "__NONE__" ? "active" : ""}" onclick="setCategoryFilter('__NONE__')">Sem categoria <b>${uncategorized}</b></button>`);
  }
  return `<div class="cat-filter-bar">${chips.join("")}</div>`;
}

// ---------- date helpers ----------
function brToIso(br) {
  if (!br) return "";
  const m = String(br).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return "";
  return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}
function isoToBr(iso) {
  if (!iso) return "";
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return "";
  return `${m[3]}/${m[2]}/${m[1]}`;
}

// ---------- sorting ----------
function compareValues(a, b, field) {
  let va = field === "situacao" ? (a.situacao || "Pendente") : (a[field]);
  let vb = field === "situacao" ? (b.situacao || "Pendente") : (b[field]);
  va = va == null ? "" : va;
  vb = vb == null ? "" : vb;
  const aEmpty = va === "", bEmpty = vb === "";
  if (aEmpty && bEmpty) return 0;
  if (aEmpty) return 1;
  if (bEmpty) return -1;
  if (DATE_FIELDS.has(field)) {
    const da = brToIso(va), db = brToIso(vb);
    return da.localeCompare(db);
  }
  return String(va).localeCompare(String(vb), "pt-BR", { numeric: true, sensitivity: "base" });
}
function onSortColumn(field) {
  if (sortField === field) { sortDir = sortDir === "asc" ? "desc" : "asc"; }
  else { sortField = field; sortDir = "asc"; }
  render();
}

// ---------- helpers ----------
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function jsq(s) { return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }
function situacaoStyle(sit) {
  switch (sit) {
    case "Totalmente conciliado": return { bg: "rgba(34,197,94,.12)", text: "var(--text-primary)", border: "rgba(34,197,94,.35)", dot: "#22C55E" };
    case "Parcialmente conciliado": return { bg: "rgba(245,158,11,.12)", text: "var(--text-primary)", border: "rgba(245,158,11,.35)", dot: "#F59E0B" };
    case "Sem movimentação": return { bg: "rgba(148,163,184,.12)", text: "var(--text-primary)", border: "rgba(148,163,184,.30)", dot: "#94A3B8" };
    default: return { bg: "rgba(239,68,68,.12)", text: "var(--text-primary)", border: "rgba(239,68,68,.35)", dot: "#EF4444" };
  }
}
function groupKey(row) { return row.grupo && row.grupo.trim() ? row.grupo.trim() : row.empresa; }
function getType(key) { return customTypes[key] === "controladoria" ? "controladoria" : "americano"; }
function getColumnsForKey(key) { return getType(key) === "controladoria" ? COLUMNS_CONTROLADORIA : COLUMNS_AMERICANO; }

function buildGroups() {
  const map = new Map();
  rows.forEach((r) => {
    const key = groupKey(r);
    if (!map.has(key)) {
      map.set(key, { key, label: key, isGrupo: !!(r.grupo && r.grupo.trim()), companies: new Set(), rows: [] });
    }
    const g = map.get(key);
    g.companies.add(r.empresa);
    g.rows.push(r);
  });
  return Array.from(map.values()).sort((a, b) => {
    const ap = pinned.has(a.key) ? 0 : 1;
    const bp = pinned.has(b.key) ? 0 : 1;
    if (ap !== bp) return ap - bp;
    return a.label.localeCompare(b.label, "pt-BR");
  });
}

// ---------- aging (tempo sem conciliar) ----------
function daysSinceLastConciliado(g) {
  const type = getType(g.key);
  const field = type === "controladoria" ? "data_envio" : "data_conciliado";
  let maxIso = null;
  g.rows.forEach((r) => {
    const iso = brToIso(r[field] || "");
    if (iso && (!maxIso || iso > maxIso)) maxIso = iso;
  });
  if (!maxIso) return null;
  const last = new Date(maxIso + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.round((today - last) / 86400000);
  return { days, lastDate: isoToBr(maxIso) };
}
function setAgingFilter(includeControladoria) { agingIncludeControladoria = includeControladoria; render(); }
function renderAgingChart(groups) {
  const source = groups.filter((g) => agingIncludeControladoria || getType(g.key) !== "controladoria");
  const list = source
    .map((g) => {
      const info = daysSinceLastConciliado(g);
      return info ? Object.assign({ daysSince: info.days, lastDateBr: info.lastDate }, g) : null;
    })
    .filter((x) => x && x.daysSince > 0)
    .sort((a, b) => b.daysSince - a.daysSince)
    .slice(0, 8);

  const toggle = `
    <div class="aging-toggle">
      <button class="aging-toggle-btn ${!agingIncludeControladoria ? "active" : ""}" onclick="setAgingFilter(false)">Fin. Americano</button>
      <button class="aging-toggle-btn ${agingIncludeControladoria ? "active" : ""}" onclick="setAgingFilter(true)">Todos os tipos</button>
    </div>
  `;

  if (!list.length) {
    return `
      <div class="aging-card">
        <div class="aging-header">
          <div><h3>⏱ Sem conciliar há mais tempo</h3><span class="hint">Com base na última data registrada</span></div>
          ${toggle}
        </div>
        <div class="aging-empty">✓ Tudo em dia por aqui — nenhuma pendência de longa data encontrada.</div>
      </div>
    `;
  }

  const maxDays = Math.max(...list.map((x) => x.daysSince), 1);
  const rowsHtml = list.map((g, i) => {
    const pct = Math.max(8, Math.round((g.daysSince / maxDays) * 100));
    const label = customLabels[g.key] != null ? customLabels[g.key] : g.label;
    let tier;
    if (g.daysSince >= settings.agingVermelho) tier = { c1: "#F59E0B", c2: "#EF4444", chipBg: "rgba(239,68,68,.14)", chipText: "#F87171" };
    else if (g.daysSince >= settings.agingAmarelo) tier = { c1: "#22B8E0", c2: "#F59E0B", chipBg: "rgba(245,158,11,.14)", chipText: "#FBBF24" };
    else tier = { c1: "#1AA6D6", c2: "#22B8E0", chipBg: "rgba(26,166,214,.14)", chipText: "#4FC3E8" };
    return `
      <div class="aging-row" onclick="openGroup('${jsq(g.key)}')" title="Última conciliação registrada: ${esc(g.lastDateBr)}">
        <div class="aging-rank">${i + 1}</div>
        <div class="aging-main">
          <div class="aging-name">${esc(label)}</div>
          <div class="aging-bar-track"><div class="aging-bar-fill" style="width:${pct}%;background:linear-gradient(90deg, ${tier.c1}, ${tier.c2})"></div></div>
        </div>
        <div class="aging-days-badge" style="background:${tier.chipBg};color:${tier.chipText}">${g.daysSince}d</div>
      </div>
    `;
  }).join("");

  return `
    <div class="aging-card">
      <div class="aging-header">
        <div><h3>⏱ Sem conciliar há mais tempo</h3><span class="hint">Com base na última data registrada · clique para abrir</span></div>
        ${toggle}
      </div>
      ${rowsHtml}
    </div>
  `;
}

// ---------- render: HOME ----------
function renderHome() {
  const groups = buildGroups();
  const term = search.trim().toLowerCase();
  const groupNames = Array.from(new Set(rows.map((r) => r.grupo && r.grupo.trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, "pt-BR"));
  const filtered = groups.filter((g) => {
    if (homeGroupFilter === "__UNGROUPED__") { if (g.isGrupo) return false; }
    else if (homeGroupFilter && g.key !== homeGroupFilter) return false;
    if (homeTypeFilter && getType(g.key) !== homeTypeFilter) return false;
    if (!term) return true;
    if (g.label.toLowerCase().includes(term)) return true;
    if (customLabels[g.key] && customLabels[g.key].toLowerCase().includes(term)) return true;
    if (customDescriptions[g.key] && customDescriptions[g.key].toLowerCase().includes(term)) return true;
    return Array.from(g.companies).some((c) => c.toLowerCase().includes(term));
  });

  const cards = filtered.map((g) => {
    const counts = { ok: 0, parcial: 0, sem: 0, pend: 0 };
    g.rows.forEach((r) => {
      const s = r.situacao || "Pendente";
      if (s === "Totalmente conciliado") counts.ok++;
      else if (s === "Parcialmente conciliado") counts.parcial++;
      else if (s === "Sem movimentação") counts.sem++;
      else counts.pend++;
    });
    const total = g.rows.length || 1;
    const bar = (n, color) => n ? `<div style="width:${(n/total*100)}%;background:${color}"></div>` : "";
    const sub = g.isGrupo
      ? `${g.companies.size} empresa${g.companies.size !== 1 ? "s" : ""} · ${g.rows.length} conta${g.rows.length !== 1 ? "s" : ""}`
      : `${g.rows.length} conta${g.rows.length !== 1 ? "s" : ""}`;
    const isPinned = pinned.has(g.key);
    const keyEsc = jsq(g.key);
    const displayLabel = customLabels[g.key] != null ? customLabels[g.key] : g.label;
    const badgeText = customBadges[g.key] != null ? customBadges[g.key] : "Semanal";

        ${isPinned ? `<div class="weekly-badge">★ ${esc(badgeText)}<span class="badge-edit" title="Editar etiqueta" onclick="editBadgeText('${keyEsc}', event)">✎</span></div>` : ''}

          <span><span class="dot" style="background:#F59E0B"></span>${counts.parcial} parcial</span>
          <span><span class="dot" style="background:#EF4444"></span>${counts.pend} pendente</span>
        </div>
        ${hasReport ? `<div><span class="report-btn" onclick="openReportModal('${keyEsc}', event)">📄 Relatório</span></div>` : ''}
      </button>

  }).join("");

  return `
    <div class="header">
      <div>
        <h1>Controle de Conciliações</h1>
        <p>Selecione um grupo ou empresa para ver os detalhes</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="save-indicator" id="save-indicator"></div>
        <button class="btn btn-sm" onclick="openEmpresasManager()" title="Cadastro de empresas">🏢 Empresas</button>
        <button class="settings-gear-btn" onclick="openSettingsModal()" title="Configurações gerais">⚙</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab ${homeTab==='painel'?'active':''}" onclick="setHomeTab('painel')">📊 Painel</button>
      <button class="tab ${homeTab==='empresas'?'active':''}" onclick="setHomeTab('empresas')">🏢 Empresas/Grupos${filtered.length ? ` (${filtered.length})` : ''}</button>
    </div>

    ${homeTab === 'painel' ? `
      <div class="home-panels">
        ${renderRemindersHomePanel(groups)}
        ${renderAgingChart(groups)}
      </div>
    ` : `
      <div class="toolbar-home">
        <input type="text" class="search-input" placeholder="Buscar grupo ou empresa..." value="${esc(search)}" oninput="onSearchHome(this.value)">
        <select class="col-filter" style="max-width:210px" onchange="onHomeGroupFilter(this.value)">
          <option value="">Todos os grupos</option>
          <option value="__UNGROUPED__" ${homeGroupFilter === "__UNGROUPED__" ? "selected" : ""}>Sem grupo (individual)</option>
          ${groupNames.map((n) => `<option value="${esc(n)}" ${homeGroupFilter === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
        </select>
        <select class="col-filter" style="max-width:200px" onchange="onHomeTypeFilter(this.value)">
          <option value="">Todos os tipos</option>
          <option value="americano" ${homeTypeFilter === "americano" ? "selected" : ""}>Financeiro Americano</option>
          <option value="controladoria" ${homeTypeFilter === "controladoria" ? "selected" : ""}>Controladoria</option>
        </select>
        ${(homeGroupFilter || homeTypeFilter) ? `<button class="btn" onclick="clearHomeFilters()">Limpar filtros</button>` : ""}
        <button class="btn" onclick="openEmpresasManager()">🏢 Gerenciar empresas</button>
        <button class="btn btn-primary" onclick="openNewModal()">+ Nova empresa</button>

      <p class="count-line">${filtered.length} grupo${filtered.length !== 1 ? "s" : ""}/empresa${filtered.length !== 1 ? "s" : ""}</p>

// ---------- render: GROUP DETAIL ----------
function renderGroupDetail() {
  const groups = buildGroups();
  const g = groups.find((x) => x.key === view.key);
  if (!g) { view = { type: "home" }; return renderHome(); }

  const type = getType(g.key);
  const cols = getColumnsForKey(g.key);
  const displayLabel = customLabels[g.key] != null ? customLabels[g.key] : g.label;
  const desc = customDescriptions[g.key] || "";
  const hasReport = reports[g.key] && (reports[g.key].url || reports[g.key].senha);
  const keyEsc = jsq(g.key);

  const header = `
    <div class="header">
      <div>
        <div class="breadcrumb"><a onclick="goHome()">← Todas as empresas</a></div>
        <h1>${esc(displayLabel)} <span class="type-tag ${type}">${type === 'controladoria' ? 'Controladoria' : 'Fin. Americano'}</span></h1>
        <p>${g.isGrupo ? `${g.companies.size} empresa(s) neste grupo` : "Empresa individual"}${desc ? " · " + esc(desc) : ""}</p>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="openGroupSettings('${keyEsc}')">⚙ Configurações</button>
          ${hasReport ? `<button class="btn btn-sm" onclick="openReportModal('${keyEsc}')">📄 Relatório</button>` : ''}
          <button class="btn btn-sm" onclick="openArchiveModal('${keyEsc}')">📦 Arquivar competência</button>
          <button class="btn btn-sm" style="color:#F87171" onclick="openDeleteGroupModal('${keyEsc}')">🗑 Excluir</button>
        </div>
      </div>
      <div class="save-indicator" id="save-indicator"></div>
    </div>

    <div class="tabs">
      <button class="tab ${activeTab==='conciliacoes'?'active':''}" onclick="setTab('conciliacoes')">Conciliações</button>
      <button class="tab ${activeTab==='lembretes'?'active':''}" onclick="setTab('lembretes')">🔔 Lembretes${(() => { const n = (reminders[g.key]||[]).filter(r => { const i = computeReminderDueInfo(r); return i && i.status !== "concluido"; }).length; return n ? ` (${n})` : ""; })()}</button>
      <button class="tab ${activeTab==='historico'?'active':''}" onclick="setTab('historico')">🗂 Histórico${(historico[g.key]||[]).length ? ` (${(historico[g.key]||[]).length})` : ''}</button>
      <button class="tab ${activeTab==='acessos'?'active':''}" onclick="setTab('acessos')">🔐 Acessos</button>
      <button class="tab ${activeTab==='importacoes'?'active':''}" onclick="setTab('importacoes')">📥 Importações${(importacoes[g.key]||[]).length ? ` (${(importacoes[g.key]||[]).length})` : ''}</button>
    </div>
  `;

  if (activeTab === "acessos") {
    return header + renderAccessTab(g.key);
  }
  if (activeTab === "importacoes") {
    return header + renderImportTab(g.key);
  }
  if (activeTab === "historico") {
    return header + renderHistoricoTab(g.key);
  }
  if (activeTab === "lembretes") {
    return header + renderRemindersTab(g.key);
  }

  return header + renderConciliacoesTab(g, cols);
}

function renderConciliacoesTab(g, cols) {
  const term = groupSearch.trim().toLowerCase();
  let list = g.rows.filter((r) => {
    for (const col of cols) {
      const active = columnFilters[col.field];
      if (!active) continue;
      const raw = col.field === "situacao" ? (r.situacao || "Pendente") : (r[col.field] || "");
      if (active === "__EMPTY__") { if (raw !== "") return false; }
      else if (raw !== active) return false;
    }
    if (categoryFilter) {
      const rc = getRowCategory(r.id);
      if (categoryFilter === "__NONE__") { if (rc) return false; }
      else if (rc !== categoryFilter) return false;
    }
    if (!term) return true;
    const rc = getRowCategory(r.id);
    return [r.empresa, r.banco, r.observacao, r.competencia, rc].filter(Boolean).some((v) => v.toLowerCase().includes(term));
  });

  if (sortField) {
    list = list.slice().sort((a, b) => {
      const cmp = compareValues(a, b, sortField);
      return sortDir === "asc" ? cmp : -cmp;
    });
  }

  const counts = { total: g.rows.length, ok: 0, parcial: 0, sem: 0, pend: 0 };
  g.rows.forEach((r) => {
    const s = r.situacao || "Pendente";
    if (s === "Totalmente conciliado") counts.ok++;
    else if (s === "Parcialmente conciliado") counts.parcial++;
    else if (s === "Sem movimentação") counts.sem++;
    else counts.pend++;
  });
  const semData = g.rows.filter((r) => !r.data_conciliado && !r.data_envio).length;
  const semObs = g.rows.filter((r) => !r.observacao).length;

  const rowsHtml = bulkDateEdit
    ? list.map((row) => renderBulkEditRow(row, cols)).join("")
    : list.map((row) => renderDisplayRow(row, cols)).join("");
  const colspan = cols.length + 1;

  const quickFilters = [
    { key: "", label: "Todos", count: g.rows.length },
    { key: "pendente", label: "Pendentes", count: counts.pend },
    { key: "parcial", label: "Parciais", count: counts.parcial },
    { key: "sem_data", label: "Sem data", count: semData },
    { key: "sem_obs", label: "Sem observação", count: semObs },
  ];
  const activeQuick = currentQuickFilter();

  return `
    <div class="summary-grid">
      <div class="summary-card"><div class="summary-icon" style="background:rgba(79,195,232,.12);color:#4FC3E8">Σ</div><div><div class="label">Total de contas</div><div class="value" style="color:#4FC3E8">${counts.total}</div></div></div>
      <div class="summary-card"><div class="summary-icon" style="background:rgba(52,211,153,.12);color:#34D399">✓</div><div><div class="label">Totalmente conciliado</div><div class="value" style="color:#34D399">${counts.ok}</div></div></div>
      <div class="summary-card"><div class="summary-icon" style="background:rgba(251,191,36,.12);color:#FBBF24">◐</div><div><div class="label">Parcialmente conciliado</div><div class="value" style="color:#FBBF24">${counts.parcial}</div></div></div>
      <div class="summary-card"><div class="summary-icon" style="background:rgba(154,161,172,.14);color:#9AA1AC">–</div><div><div class="label">Sem movimentação</div><div class="value" style="color:#9AA1AC">${counts.sem}</div></div></div>
      <div class="summary-card"><div class="summary-icon" style="background:rgba(248,113,113,.12);color:#F87171">!</div><div><div class="label">Pendente</div><div class="value" style="color:#F87171">${counts.pend}</div></div></div>
    </div>

    <div class="quick-filters">
      ${quickFilters.map((qf) => `<button class="quick-filter-chip ${activeQuick === qf.key ? "active" : ""}" onclick="applyQuickFilter('${qf.key}')">${esc(qf.label)} <b>${qf.count}</b></button>`).join("")}
    </div>

    ${renderCategoryFilterBar(g.rows)}

    <div class="toolbar">
      <input type="text" class="search-input" placeholder="Buscar por empresa, banco, categoria, observação..." value="${esc(groupSearch)}" oninput="onSearchGroup(this.value)">
      ${!bulkDateEdit && hasActiveColumnFilters() ? `<button class="btn" onclick="clearColumnFilters()">Limpar filtros de coluna</button>` : ""}
      <button class="btn" onclick="openCategoryManager()" title="Gerenciar categorias disponíveis">🏷 Categorias</button>
      ${bulkDateEdit ? `
        <button class="btn btn-sm" onclick="fillAllBulkDatesToday('${jsq(g.key)}')" title="Preenche a data principal de todas as linhas com a data de ontem">📅 Preencher ontem em todas</button>
        <button class="btn btn-primary" onclick="saveBulkDateEdit()">💾 Salvar todas as datas</button>
        <button class="btn" onclick="cancelBulkDateEdit()">Cancelar</button>
      ` : `
        <button class="btn" onclick="startBulkDateEdit('${jsq(g.key)}')" title="Editar a data de cada conta de uma só vez, sem abrir uma por uma">🗓 Editar todas as datas</button>
        <button class="btn btn-primary" onclick="addRowToGroup('${jsq(g.key)}', ${g.isGrupo})">+ Nova linha</button>
      `}
    </div>

    ${bulkDateEdit ? `<p class="hint" style="margin:-4px 0 10px">Ajuste a data de cada linha abaixo (ou use "Preencher ontem em todas") e clique em "Salvar todas as datas" ao final. Cada conta mantém seu próprio valor até você alterá-lo.</p>` : ""}

    <p class="count-line">Exibindo ${list.length} de ${g.rows.length} contas</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            ${cols.map((c) => {
              const active = sortField === c.field;
              const arrow = active ? `<span class="sort-arrow">${sortDir === "asc" ? "▲" : "▼"}</span>` : "";
              return `<th class="sortable" onclick="onSortColumn('${c.field}')" title="Ordenar por ${esc(c.label)}">${esc(c.label)}${arrow}</th>`;
            }).join("")}<th></th>
          </tr>
          <tr class="filter-row">${cols.map((c) => `<th>${renderColumnFilterSelect(c, g.rows)}</th>`).join("")}<th></th></tr>
        </thead>
        <tbody>
          ${rowsHtml || `<tr><td colspan="${colspan}" style="padding:32px;text-align:center;color:#9AA5AF;">Nenhum registro encontrado.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function currentQuickFilter() {
  if (columnFilters.situacao === "Pendente") return "pendente";
  if (columnFilters.situacao === "Parcialmente conciliado") return "parcial";
  if (columnFilters.data_conciliado === "__EMPTY__") return "sem_data";
  if (columnFilters.observacao === "__EMPTY__") return "sem_obs";
  return "";
}
function applyQuickFilter(kind) {
  Object.keys(columnFilters).forEach((k) => (columnFilters[k] = ""));
  if (kind === "pendente") columnFilters.situacao = "Pendente";
  else if (kind === "parcial") columnFilters.situacao = "Parcialmente conciliado";
  else if (kind === "sem_data") columnFilters.data_conciliado = "__EMPTY__";
  else if (kind === "sem_obs") columnFilters.observacao = "__EMPTY__";
  render();
}
function fillAllBulkDatesToday(gkey) {
  const field = getType(gkey) === "controladoria" ? "data_envio" : "data_conciliado";
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const iso = d.toISOString().slice(0, 10);
  Object.keys(bulkDraft).forEach((id) => { bulkDraft[id][field] = isoToBr(iso); });
  render();
}

function renderSituacaoCell(row) {
  const sit = row.situacao || "Pendente";
  const st = situacaoStyle(sit);
  const isOpen = openStatusId === row.id;
  const optionsHtml = SITUACOES.map((s) => {
    const os = situacaoStyle(s);
    const active = s === sit;
    return `<button type="button" class="status-option ${active ? "active" : ""}" onclick="event.stopPropagation(); onSituacaoChange(${row.id}, '${jsq(s)}')"><span class="status-dot" style="background:${os.dot}"></span>${esc(s)}</button>`;
  }).join("");
  return `<td>
    <div class="status-dropdown-wrap">
      <button type="button" class="status-trigger" style="background:${st.bg};color:${st.text};border-color:${st.border}" onclick="event.stopPropagation(); toggleStatusDropdown(${row.id})">
        <span class="status-dot" style="background:${st.dot}"></span>${esc(sit)}<span class="status-caret">▾</span>
      </button>
      ${isOpen ? `<div class="status-popover">${optionsHtml}</div>` : ""}
    </div>
  </td>`;
}
function toggleStatusDropdown(id) {
  openStatusId = openStatusId === id ? null : id;
  render();
}
function renderObservacaoCell(row) {
  return `<td class="obs-cell"><textarea class="obs-editable" placeholder="Adicionar observação, pendência ou anotação..." oninput="onObservacaoInput(${row.id}, this.value)">${esc(row.observacao)}</textarea></td>`;
}

function renderDisplayCell(row, col) {
  const f = col.field;
  if (f === "situacao") return renderSituacaoCell(row);
  if (f === "observacao") return renderObservacaoCell(row);
  const v = row[f] || "";
  if (DATE_FIELDS.has(f)) return `<td>${v ? `<span class="date-highlight">${esc(v)}</span>` : "—"}</td>`;
  if (f === "empresa") return `<td class="empresa-cell">${esc(v) || "—"}</td>`;
  if (f === "banco") {
    const cat = getRowCategory(row.id);
    return `<td class="banco-cell"><div class="banco-wrap"><span class="banco-name">${esc(v) || "—"}</span>${renderCategoryBadge(cat)}</div></td>`;
  }
  return `<td>${esc(v) || "—"}</td>`;
}
function renderDisplayRow(row, cols) {
  return `<tr>${cols.map(c => renderDisplayCell(row, c)).join("")}<td class="row-actions">
    <button class="btn btn-sm" onclick="openEditModal(${row.id})" title="Editar todos os campos">✎ Editar</button>
    <button class="icon-btn danger" onclick="deleteRow(${row.id})" title="Excluir lançamento">🗑</button>
  </td></tr>`;
}

function renderBulkDateCell(row, col) {
  const f = col.field;
  const d = bulkDraft[row.id] || {};
  const val = d[f] !== undefined ? d[f] : (row[f] || "");
  if (DATE_FIELDS.has(f)) {
    const inputId = `bulk-date-${row.id}-${f}`;
    return `<td><div class="date-edit-cell"><input type="date" id="${inputId}" class="edit-input" value="${esc(brToIso(val))}" onchange="updateBulkDraft(${row.id}, '${f}', this.value)"><button type="button" class="mini-today-btn" onclick="setBulkDateToday(${row.id}, '${f}', '${inputId}')">Ontem</button></div></td>`;
  }
  if (f === "competencia") {
    return `<td><input type="text" class="edit-input" style="width:80px" value="${esc(val)}" oninput="updateBulkDraftText(${row.id}, '${f}', this.value)"></td>`;
  }
  if (f === "situacao") {
    const sit = row.situacao || "Pendente";
    const st = situacaoStyle(sit);
    return `<td><span class="badge" style="background:${st.bg};color:${st.text};border:1px solid ${st.border}"><span class="status-dot" style="background:${st.dot};margin-right:6px"></span>${esc(sit)}</span></td>`;
  }
  if (f === "observacao") return `<td><span class="obs-display">${esc(row.observacao) || "—"}</span></td>`;
  if (f === "empresa") return `<td class="empresa-cell">${esc(row.empresa) || "—"}</td>`;
  return `<td>${esc(row[f]) || "—"}</td>`;
}
function setBulkDateToday(rowId, field, inputId) {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const iso = d.toISOString().slice(0, 10);
  updateBulkDraft(rowId, field, iso);
  const el = document.getElementById(inputId);
  if (el) el.value = iso;
}
function renderBulkEditRow(row, cols) {
  return `<tr>${cols.map((c) => renderBulkDateCell(row, c)).join("")}<td class="row-actions"></td></tr>`;
}
function startBulkDateEdit(gkey) {
  const groups = buildGroups();
  const g = groups.find((x) => x.key === gkey);
  if (!g) return;
  bulkDraft = {};
  g.rows.forEach((r) => {
    bulkDraft[r.id] = {
      saldo_batendo: r.saldo_batendo || "",
      data_conciliado: r.data_conciliado || "",
      data_envio: r.data_envio || "",
      competencia: r.competencia || "",
    };
  });
  bulkDateEdit = true;
  render();
}
function updateBulkDraft(rowId, field, isoValue) {
  if (!bulkDraft[rowId]) bulkDraft[rowId] = {};
  bulkDraft[rowId][field] = isoValue ? isoToBr(isoValue) : "";
}
function updateBulkDraftText(rowId, field, value) {
  if (!bulkDraft[rowId]) bulkDraft[rowId] = {};
  bulkDraft[rowId][field] = value;
}
function saveBulkDateEdit() {
  rows = rows.map((r) => (bulkDraft[r.id] ? Object.assign({}, r, bulkDraft[r.id]) : r));
  saveData();
  bulkDateEdit = false;
  bulkDraft = {};
  render();
}
function cancelBulkDateEdit() {
  bulkDateEdit = false;
  bulkDraft = {};
  render();
}

// ---------- Access tab ----------
const ACCESS_FIELDS = [
  ["banco","Banco"],
  ["usuario","Usuário"],
  ["senha","Senha"],
  ["agencia","Agência"],
  ["conta","Conta"],
  ["codigos","Códigos de acesso"],
  ["observacoes","Observações"]
];

function renderAccessTab(gkey) {
  const items = accesses[gkey] || [];
  const keyEsc = jsq(gkey);
  const cards = items.map(item => `
    <div class="access-item">
      <div class="access-item-title">
        <h4>${esc(item.banco || "Sem título")}</h4>
        <div style="display:flex;gap:4px">
          <button class="btn-ghost" onclick="editAccess('${keyEsc}', ${item.id})" title="Editar">✎</button>
          <button class="btn-danger-ghost" onclick="deleteAccess('${keyEsc}', ${item.id})" title="Excluir">✕</button>
        </div>
      </div>
      <div class="access-fields">
        ${ACCESS_FIELDS.filter(([k]) => k !== "banco").map(([k,label]) => item[k] ? `
          <div class="access-field ${k==='observacoes'?'obs':''}">
            <div class="k">${label}</div>
            <div class="v"><span class="val">${esc(item[k])}</span><button class="mini-copy" onclick="copyAccessField('${keyEsc}', ${item.id}, '${k}', this)">Copiar</button></div>
          </div>` : "").join("")}
      </div>
    </div>
  `).join("");

  return `
    <div class="toolbar">
      <button class="btn btn-primary" onclick="editAccess('${keyEsc}', null)">+ Novo acesso</button>
      <label class="btn file-btn">
        📥 Importar planilha
        <input type="file" accept=".xlsx,.xls,.csv" onchange="importAccessSpreadsheet(event, '${keyEsc}')">
      </label>
      <span class="hint">Cabeçalhos reconhecidos: banco, usuário, senha, agência, conta, códigos, observações</span>
    </div>
    ${items.length ? cards : `<div class="empty-state">Nenhum acesso cadastrado. Adicione manualmente ou importe a planilha da empresa.</div>`}
  `;
}
function copyAccessField(gkey, id, field, btn) {
  const item = (accesses[gkey] || []).find(x => x.id === id);
  if (!item) return;
  const val = String(item[field] || "");
  navigator.clipboard.writeText(val).catch(()=>{});
  const old = btn.textContent;
  btn.textContent = "Copiado!";
  setTimeout(() => btn.textContent = old, 1200);
}
function editAccess(gkey, id) {
  const list = accesses[gkey] || [];

function importAccessSpreadsheet(ev, gkey) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rowsJson = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
      const mapping = {
        banco:      ["banco","bank","instituicao","instituição","titulo","título","descricao","descrição"],
        usuario:    ["usuario","usuário","user","login","cpf","cnpj","email","e-mail"],
        senha:      ["senha","password","pass","pwd"],
        agencia:    ["agencia","agência","ag"],
        conta:      ["conta","cc","c/c","account","numero da conta","número da conta"],
        codigos:    ["codigos","códigos","codigo","código","token","chave","codigo de acesso","código de acesso"],
        observacoes:["observacoes","observações","observacao","observação","obs","notas","nota","comentario","comentário"]
      };
      const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
      const list = accesses[gkey] || [];
      let nextId = list.length ? Math.max(...list.map(x => x.id)) + 1 : 1;
      let imported = 0;
      rowsJson.forEach(r => {
        const item = { id: nextId, banco:"", usuario:"", senha:"", agencia:"", conta:"", codigos:"", observacoes:"" };
        Object.keys(r).forEach(colName => {
          const nk = norm(colName);
          for (const [target, aliases] of Object.entries(mapping)) {
            if (aliases.some(a => nk === norm(a) || nk.includes(norm(a)))) {
              const val = String(r[colName] == null ? "" : r[colName]).trim();
              if (val && !item[target]) item[target] = val;
              break;
            }
          }
        });
        const hasContent = ["banco","usuario","senha","agencia","conta","codigos","observacoes"].some(k => item[k]);
        if (hasContent) { list.push(item); nextId++; imported++; }
      });
      accesses[gkey] = list;
      saveAccesses();
      render();
      alert(`Importados ${imported} acesso(s) da planilha.`);
    } catch (err) {
      alert("Erro ao importar planilha: " + err.message);
    }
    ev.target.value = "";
  };
  reader.readAsArrayBuffer(file);
}

// ---------- Lembretes de documentos ----------
function currentCycleKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function computeReminderDueInfo(rem) {
  if (!rem.ativo) return null;
  const todayD = new Date();
  todayD.setHours(0, 0, 0, 0);
  const antecedencia = Number.isFinite(rem.antecedenciaDias) ? rem.antecedenciaDias : 0;

  if (rem.frequencia === "unica") {
    const status = rem.status || "pendente";
    if (!rem.dataUnica) return null;
    const due = new Date(rem.dataUnica + "T00:00:00");
    const diffDays = Math.round((due - todayD) / 86400000);
    let categoria = null;
    if (status === "pendente") {
      const alertaDate = new Date(due);
      alertaDate.setDate(alertaDate.getDate() - antecedencia);
      if (diffDays < 0) categoria = "atrasado";
      else if (todayD >= alertaDate) categoria = "proximo";
    }
    return { status, dueDateBr: isoToBr(rem.dataUnica), diffDays, categoria, cycleKey: null };
  }

  // mensal
  const y = todayD.getFullYear(), m = todayD.getMonth();
  const curKey = currentCycleKey(todayD);
  const cyc = rem.statusCycle; // { key, status }
  let cycleY = y, cycleM = m;
  if (cyc && cyc.key === curKey && (cyc.status === "solicitado" || cyc.status === "recebido")) {
    cycleM = m === 11 ? 0 : m + 1;
    cycleY = m === 11 ? y + 1 : y;
  }
  const cdim = new Date(cycleY, cycleM + 1, 0).getDate();
  const dia = Math.min(rem.diaMes || 1, cdim);
  const due = new Date(cycleY, cycleM, dia);
  const cycleKeyForDue = cycleY + "-" + String(cycleM + 1).padStart(2, "0");
  let status = "pendente";
  if (cyc && cyc.key === cycleKeyForDue) status = cyc.status;
  const diffDays = Math.round((due - todayD) / 86400000);
  let categoria = null;
  if (status === "pendente") {
    const alertaDate = new Date(due);
    alertaDate.setDate(alertaDate.getDate() - antecedencia);
    if (diffDays < 0) categoria = "atrasado";
    else if (todayD >= alertaDate) categoria = "proximo";
  }
  const dueIso = cycleY + "-" + String(cycleM + 1).padStart(2, "0") + "-" + String(dia).padStart(2, "0");
  return { status, dueDateBr: isoToBr(dueIso), diffDays, categoria, cycleKey: cycleKeyForDue };
}
function reminderStatusStyle(tag) {
  switch (tag) {
    case "atrasado": return { bg: "rgba(239,68,68,.12)", text: "var(--text-primary)", border: "rgba(239,68,68,.35)", label: "Atrasado" };
    case "proximo": return { bg: "rgba(245,158,11,.12)", text: "var(--text-primary)", border: "rgba(245,158,11,.35)", label: "Próximo a solicitar" };
    case "solicitado": return { bg: "rgba(79,195,232,.12)", text: "var(--text-primary)", border: "rgba(79,195,232,.35)", label: "Solicitado" };
    case "recebido": return { bg: "rgba(34,197,94,.12)", text: "var(--text-primary)", border: "rgba(34,197,94,.35)", label: "Recebido" };
    default: return { bg: "rgba(148,163,184,.12)", text: "var(--text-primary)", border: "rgba(148,163,184,.30)", label: "Programado" };
  }
}
function reminderTag(info) {
  if (info.status === "solicitado") return "solicitado";
  if (info.status === "recebido") return "recebido";
  return info.categoria || "programado";
}
function renderRemindersHomePanel(groups) {
  const items = [];
  groups.forEach((g) => {
    (reminders[g.key] || []).forEach((rem) => {
      const info = computeReminderDueInfo(rem);
      if (!info || info.status !== "pendente" || !info.categoria) return;
      const gname = customLabels[g.key] != null ? customLabels[g.key] : g.label;

  const atrasados = items.filter((it) => it.info.categoria === "atrasado").sort((a, b) => a.info.diffDays - b.info.diffDays);
  const proximos = items.filter((it) => it.info.categoria === "proximo").sort((a, b) => a.info.diffDays - b.info.diffDays);
  const total = items.length;

  const byGroup = {};
  items.forEach((it) => { byGroup[it.gname] = (byGroup[it.gname] || 0) + 1; });
  const groupChips = Object.keys(byGroup).sort((a, b) => byGroup[b] - byGroup[a])
    .map((name) => `<span class="reminder-group-chip">${esc(name)} <b>${byGroup[name]}</b></span>`).join("");

  function renderList(list, emptyMsg) {
    if (!list.length) return `<div class="reminder-empty-sub">${emptyMsg}</div>`;
    return list.map((it) => {
      const st = reminderStatusStyle(it.info.categoria);
      return `
        <div class="reminder-row">
          <div class="reminder-main" onclick="openGroup('${jsq(it.gkey)}')">
            <div class="reminder-doc">${esc(it.rem.documento)}</div>
            <div class="reminder-sub">${esc(it.gname)} · vence ${esc(it.info.dueDateBr)}</div>
          </div>
          <span class="badge" style="background:${st.bg};color:${st.text};border:1px solid ${st.border}">${st.label}</span>
          <button class="msg-btn" title="Gerar mensagem de solicitação" onclick="event.stopPropagation(); openTemplatePicker('${jsq(it.gkey)}','${jsq(it.rem.id)}')">💬 Solicitar</button>
          <button class="btn btn-sm" onclick="event.stopPropagation(); setReminderStatus('${jsq(it.gkey)}','${jsq(it.rem.id)}','solicitado')">✓ Solicitado</button>
        </div>
      `;
    }).join("");
  }

  if (!total) {
    return `
      <div class="reminder-card">
        <div class="reminder-header"><h3>🔔 Lembretes de documentos</h3><span class="hint">Nada pendente no momento</span><span class="reminder-header-actions"><button class="calendar-open-btn" title="Abrir calendário de documentos" onclick="openCalendarModal()">📅 Calendário</button></span></div>
      </div>
    `;
  }

  return `
    <div class="reminder-card">
      <div class="reminder-header"><h3>🔔 Lembretes de documentos</h3><span class="hint">${total} pendência(s) no total</span><span class="reminder-header-actions"><button class="calendar-open-btn" title="Abrir calendário de documentos" onclick="openCalendarModal()">📅 Calendário</button></span></div>
      ${groupChips ? `<div class="reminder-group-summary">${groupChips}</div>` : ""}
      <div class="reminder-section-label reminder-section-atrasado">⚠ Atrasados ${atrasados.length ? `(${atrasados.length})` : ""}</div>
      ${renderList(atrasados, "Nenhum documento atrasado.")}
      <div class="reminder-section-label reminder-section-proximo">🕒 Próximos a solicitar ${proximos.length ? `(${proximos.length})` : ""}</div>
      ${renderList(proximos, "Nada previsto para os próximos dias.")}
    </div>
  `;
}
function renderRemindersTab(gkey) {

  const pendentes = withInfo.filter((x) => x.info.status === "pendente").sort((a, b) => a.info.diffDays - b.info.diffDays);
  const aguardando = withInfo.filter((x) => x.info.status === "solicitado");
  const recebidos = withInfo.filter((x) => x.info.status === "recebido");

  function row({ rem, info }, actionsHtml) {
    const st = reminderStatusStyle(reminderTag(info));
    const freqLabel = rem.frequencia === "mensal" ? `Mensal · dia ${rem.diaMes}` : `Data única`;
    const antLabel = rem.antecedenciaDias ? ` · aviso ${rem.antecedenciaDias}d antes` : "";
    return `

      </div>
    `;
  }

  const pendentesHtml = pendentes.map((x) => row(x, `
    <button class="msg-btn" onclick="openTemplatePicker('${jsq(gkey)}','${jsq(x.rem.id)}')">💬 Solicitar</button>
    <button class="btn btn-sm" onclick="setReminderStatus('${jsq(gkey)}','${jsq(x.rem.id)}','solicitado')">✓ Solicitado</button>
    <button class="btn btn-sm" onclick="openReminderModal('${jsq(gkey)}','${jsq(x.rem.id)}')">✎</button>
  `)).join("");

  const aguardandoHtml = aguardando.length ? `
    <p class="hint" style="margin:18px 0 8px">Aguardando recebimento</p>
    ${aguardando.map((x) => row(x, `
      <button class="btn btn-sm" onclick="setReminderStatus('${jsq(gkey)}','${jsq(x.rem.id)}','recebido')">✓ Recebido</button>
      <button class="btn btn-sm" onclick="reopenReminder('${jsq(gkey)}','${jsq(x.rem.id)}')">↺</button>
    `)).join("")}
  ` : "";

  const recebidosHtml = recebidos.length ? `
    <p class="hint" style="margin:18px 0 8px">Recebidos</p>
    ${recebidos.map((x) => `
      <div class="access-item" style="opacity:.6">
        <div class="access-item-title">
          <h4>${esc(x.rem.documento)}</h4>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm" onclick="reopenReminder('${jsq(gkey)}','${jsq(x.rem.id)}')">Reabrir</button>
            <button class="btn-danger-ghost" onclick="deleteReminder('${jsq(gkey)}','${jsq(x.rem.id)}')" title="Excluir">✕</button>
          </div>
        </div>
        <div class="sub" style="margin-bottom:0">Recebido${x.rem.frequencia === "mensal" ? " · o próximo ciclo abrirá automaticamente" : ""}</div>
      </div>
    `).join("")}
  ` : "";

  return `
    <div class="toolbar"><button class="btn btn-primary btn-sm" onclick="openReminderModal('${jsq(gkey)}')">+ Novo lembrete</button></div>
    ${pendentes.length ? pendentesHtml : `<div class="empty-state">Nenhum lembrete pendente.<br>Use "+ Novo lembrete" para cadastrar documentos que precisam ser solicitados periodicamente a este cliente.</div>`}
    ${aguardandoHtml}
    ${recebidosHtml}
  `;

function openReminderModal(gkey, id) {
  const list = reminders[gkey] || [];
  const rem = id ? list.find((r) => r.id === id) : null;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "reminder-modal-overlay";
  overlay.innerHTML = `
    <div class="modal" style="width:440px">
      <h3>${rem ? "Editar lembrete" : "Novo lembrete"}</h3>
      <label>Documento / solicitação</label>
      <input type="text" id="rm-doc" placeholder="Ex: Extrato bancário Itaú, Fatura do cartão..." value="${rem ? esc(rem.documento) : ""}">
      <label style="margin-top:14px">Frequência</label>
      <select id="rm-freq" onchange="onReminderFreqChange()">
        <option value="mensal" ${!rem || rem.frequencia === "mensal" ? "selected" : ""}>Mensal (todo mês)</option>
        <option value="unica" ${rem && rem.frequencia === "unica" ? "selected" : ""}>Data específica (única)</option>
      </select>

      </div>

        <label>Data da solicitação</label>
        <input type="date" id="rm-data" value="${rem && rem.dataUnica ? rem.dataUnica : ""}">
      </div>
      <label style="margin-top:14px">Antecedência do lembrete (dias antes da data)</label>
      <input type="number" id="rm-antecedencia" min="0" max="60" value="${rem && Number.isFinite(rem.antecedenciaDias) ? rem.antecedenciaDias : settings.antecedenciaPadrao}">
      <p class="hint" style="margin-top:4px">O lembrete passa a aparecer como "Próximo a solicitar" a partir dessa quantidade de dias antes da data.</p>
      <label style="margin-top:14px">Observação (opcional)</label>
      <textarea id="rm-obs" style="width:100%;min-height:50px" placeholder="Detalhe, contato do cliente, etc.">${rem ? esc(rem.observacao || "") : ""}</textarea>
      <div class="actions">
        ${rem ? `<button class="btn-danger-ghost" style="margin-right:auto" onclick="deleteReminder('${jsq(gkey)}','${jsq(rem.id)}')">Excluir</button>` : ""}
        <button class="btn" onclick="closeReminderModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveReminder('${jsq(gkey)}'${rem ? `,'${jsq(rem.id)}'` : ""})">Salvar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  onReminderFreqChange();
  document.getElementById("rm-doc").focus();
}
function onReminderFreqChange() {
  const freq = document.getElementById("rm-freq").value;
  document.getElementById("rm-mensal-field").style.display = freq === "mensal" ? "block" : "none";
  document.getElementById("rm-unica-field").style.display = freq === "unica" ? "block" : "none";
}
function closeReminderModal() { const el = document.getElementById("reminder-modal-overlay"); if (el) el.remove(); }
function saveReminder(gkey, id) {
  const documento = document.getElementById("rm-doc").value.trim();
  if (!documento) { alert("Informe o nome do documento/solicitação."); return; }
  const freq = document.getElementById("rm-freq").value;
  const obs = document.getElementById("rm-obs").value.trim();
  let ant = parseInt(document.getElementById("rm-antecedencia").value, 10);
  if (!Number.isFinite(ant) || ant < 0) ant = 0;
  if (!reminders[gkey]) reminders[gkey] = [];
  let rem = id ? reminders[gkey].find((r) => r.id === id) : null;
  if (!rem) {
    rem = { id: "r" + Date.now(), ativo: true, status: "pendente", statusCycle: null };
    reminders[gkey].push(rem);
  }
  rem.documento = documento;
  rem.frequencia = freq;
  rem.observacao = obs;
  rem.antecedenciaDias = ant;
  if (freq === "mensal") {
    let dia = parseInt(document.getElementById("rm-dia").value, 10);
    if (!dia || dia < 1) dia = 1;
    if (dia > 28) dia = 28;
    rem.diaMes = dia;
    rem.dataUnica = null;
  } else {
    const data = document.getElementById("rm-data").value;
    if (!data) { alert("Informe a data do lembrete."); return; }
    rem.dataUnica = data;
    if (!rem.status) rem.status = "pendente";
  }
  saveReminders();
  closeReminderModal();
  render();
}
function deleteReminder(gkey, id) {
  if (!confirm("Excluir este lembrete? Essa ação não pode ser desfeita.")) return;
  reminders[gkey] = (reminders[gkey] || []).filter((r) => r.id !== id);
  saveReminders();
  closeReminderModal();
  render();
}
function setReminderStatus(gkey, id, newStatus) {
  const rem = (reminders[gkey] || []).find((r) => r.id === id);
  if (!rem) return;
  if (rem.frequencia === "unica") {
    rem.status = newStatus;
  } else {
    let cycleKey;
    if (rem.statusCycle && rem.statusCycle.status === "solicitado" && newStatus === "recebido") {
      cycleKey = rem.statusCycle.key;
    } else {
      const info = computeReminderDueInfo(rem);
      cycleKey = info && info.cycleKey ? info.cycleKey : currentCycleKey(new Date());
    }
    rem.statusCycle = { key: cycleKey, status: newStatus };
  }
  saveReminders();
  render();
}
function reopenReminder(gkey, id) {
  const rem = (reminders[gkey] || []).find((r) => r.id === id);
  if (!rem) return;
  if (rem.frequencia === "unica") rem.status = "pendente";
  else rem.statusCycle = null;
  saveReminders();
  render();
}
