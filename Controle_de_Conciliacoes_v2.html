function fillTemplateVars(text, ctx) {
  return String(text || "").replace(/\{(\w+)\}/g, (_, k) => (ctx[k] != null ? ctx[k] : "{" + k + "}"));
}
function templateContext(gkey, rem) {
  const label = customLabels[gkey] != null ? customLabels[gkey] : gkey;
  const info = rem ? computeReminderDueInfo(rem) : null;
  const hoje = new Date();
  const dueBr = info ? info.dueDateBr : "";
  const periodo = (() => {
    if (!rem) return "";
    if (rem.frequencia === "mensal") {
      const parts = dueBr.split("/");
      if (parts.length === 3) return `${MESES_PT[parseInt(parts[1],10)-1]}/${parts[2]}`;
      return "mês vigente";
    }
    return dueBr;
  })();
  return {
    empresa: label,
    documento: rem ? rem.documento : "",
    periodo: periodo,
    dataSolicitacao: dueBr,
    dataHoje: `${String(hoje.getDate()).padStart(2,"0")}/${String(hoje.getMonth()+1).padStart(2,"0")}/${hoje.getFullYear()}`,
    mes: dueBr.split("/")[1] ? MESES_PT[parseInt(dueBr.split("/")[1],10)-1] : "",
    ano: dueBr.split("/")[2] || String(hoje.getFullYear())
  };
}
let tplPickerState = { gkey: null, remId: null, selectedId: null };
function openTemplatePicker(gkey, remId) {
  tplPickerState = { gkey, remId, selectedId: templates[0] ? templates[0].id : null };

}
function closeTemplatePicker() { const el = document.getElementById("tpl-picker-overlay"); if (el) el.remove(); }
function selectTemplate(id) { tplPickerState.selectedId = id; refreshTemplatePicker(); }
function refreshTemplatePicker() {
  const el = document.getElementById("tpl-picker-overlay");
  if (el) el.innerHTML = renderTemplatePicker();
}
function renderTemplatePicker() {
  const rem = (reminders[tplPickerState.gkey] || []).find((r) => r.id === tplPickerState.remId);
  const ctx = templateContext(tplPickerState.gkey, rem);
  const tpl = templates.find((t) => t.id === tplPickerState.selectedId) || templates[0];
  const preview = tpl ? fillTemplateVars(tpl.texto, ctx) : "";
  const items = templates.map((t) => `
    <div class="tpl-item ${t.id === (tpl && tpl.id) ? "selected" : ""}" onclick="selectTemplate('${jsq(t.id)}')">

  return `

      <h3>💬 Central de solicitação — ${esc(ctx.empresa)}</h3>

      <div style="display:grid;grid-template-columns:220px 1fr;gap:14px;margin-top:10px">
        <div>
          <label style="margin:0 0 6px">Modelos</label>
          <div class="tpl-list">${items || `<div class="hint">Nenhum modelo cadastrado.</div>`}</div>
          <button class="btn btn-sm" style="margin-top:8px;width:100%" onclick="openTemplatesManager()">Gerenciar modelos</button>
        </div>
        <div>
          <label style="margin:0 0 6px">Mensagem gerada</label>
          <textarea class="tpl-preview" id="tpl-preview-text" style="width:100%">${esc(preview)}</textarea>
          <p class="hint" style="margin-top:4px">Variáveis disponíveis: {empresa}, {documento}, {periodo}, {dataSolicitacao}, {dataHoje}, {mes}, {ano}</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="closeTemplatePicker()">Fechar</button>
        <button class="btn btn-primary" onclick="copyTemplateMessage()">📋 Copiar mensagem</button>
      </div>
    </div>
  `;
}
function copyTemplateMessage() {
  const ta = document.getElementById("tpl-preview-text");
  if (!ta) return;
  ta.select();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value);
    else document.execCommand("copy");
    const btns = document.querySelectorAll("#tpl-picker-overlay .btn-primary");
    btns.forEach((b) => { const t = b.textContent; b.textContent = "✓ Copiado!"; setTimeout(() => (b.textContent = t), 1400); });
  } catch(e) { alert("Não foi possível copiar automaticamente. Selecione e copie manualmente."); }
}

// ---------- Calendário de Documentos ----------
function openCalendarModal() {
  const today = new Date();
  if (calendarView.year == null) { calendarView.year = today.getFullYear(); calendarView.month = today.getMonth(); }
  calendarView.open = true;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "calendar-overlay";
  overlay.innerHTML = renderCalendarModal();
  document.body.appendChild(overlay);
}
function closeCalendarModal() { calendarView.open = false; const el = document.getElementById("calendar-overlay"); if (el) el.remove(); }
function refreshCalendar() { const el = document.getElementById("calendar-overlay"); if (el) el.innerHTML = renderCalendarModal(); }
function calendarNav(delta) {
  let m = calendarView.month + delta;
  let y = calendarView.year;
  if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
  calendarView.month = m; calendarView.year = y;
  refreshCalendar();
}
function calendarTodayNav() {
  const t = new Date(); calendarView.year = t.getFullYear(); calendarView.month = t.getMonth();
  refreshCalendar();
}
function onCalendarFilter(kind, value) {
  if (kind === "group") calendarView.filterGroup = value;
  else if (kind === "status") calendarView.filterStatus = value;
  refreshCalendar();
}
function collectCalendarItems(year, month) {
  // Retorna itens para o mês/ano informado: { gkey, gname, rem, dueDate:Date, statusTag }
  const groups = buildGroups();
  const items = [];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const cycleKey = year + "-" + String(month + 1).padStart(2, "0");
  const today = new Date(); today.setHours(0,0,0,0);
  const cdim = lastDay.getDate();
  groups.forEach((g) => {
    if (calendarView.filterGroup && g.key !== calendarView.filterGroup) return;
    (reminders[g.key] || []).forEach((rem) => {
      if (!rem.ativo) return;
      const gname = customLabels[g.key] != null ? customLabels[g.key] : g.label;
      let due, status;
      if (rem.frequencia === "unica") {
        if (!rem.dataUnica) return;
        const [Y, M, D] = rem.dataUnica.split("-").map(Number);
        if (Y !== year || (M - 1) !== month) return;
        due = new Date(Y, M - 1, D);
        status = rem.status || "pendente";
      } else {
        const dia = Math.min(rem.diaMes || 1, cdim);
        due = new Date(year, month, dia);
        const cyc = rem.statusCycle;
        status = (cyc && cyc.key === cycleKey) ? cyc.status : "pendente";
      }
      // Categoria visual (apenas se pendente)
      let tag = status;
      if (status === "pendente") {
        const diff = Math.round((due - today) / 86400000);
        const ant = Number.isFinite(rem.antecedenciaDias) ? rem.antecedenciaDias : 0;
        if (diff < 0) tag = "atrasado";
        else if (diff <= ant) tag = "proximo";
        else tag = "pendente";
      }
      if (calendarView.filterStatus && tag !== calendarView.filterStatus) return;
      items.push({ gkey: g.key, gname, rem, dueDate: due, statusTag: tag });
    });
  });
  return items;
}
function renderCalendarModal() {
  const y = calendarView.year, m = calendarView.month;
  const items = collectCalendarItems(y, m);
  const byDay = {};
  items.forEach((it) => {
    const d = it.dueDate.getDate();
    (byDay[d] = byDay[d] || []).push(it);
  });
  const groups = buildGroups();
  const groupOptions = groups.map((g) => {
    const label = customLabels[g.key] != null ? customLabels[g.key] : g.label;
    return `<option value="${esc(g.key)}" ${calendarView.filterGroup === g.key ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  const firstOfMonth = new Date(y, m, 1);
  const startDow = firstOfMonth.getDay(); // 0 = Dom
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const isCurMonth = today.getFullYear() === y && today.getMonth() === m;
  const dow = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  let cells = "";
  // Preencher dias anteriores em cinza para completar a primeira semana
  const prevDaysToShow = startDow;
  const prevMonthLastDay = new Date(y, m, 0).getDate();
  for (let i = prevDaysToShow; i > 0; i--) {
    cells += `<div class="cal-cell other"><span class="cal-day-num">${prevMonthLastDay - i + 1}</span></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dayItems = (byDay[d] || []).slice().sort((a,b) => a.gname.localeCompare(b.gname, "pt-BR"));
    const isToday = isCurMonth && today.getDate() === d;
    const itemsHtml = dayItems.map((it) => `
      <div class="cal-item status-${it.statusTag}" title="${esc(it.gname)} — ${esc(it.rem.documento)}" onclick="calendarGoToItem('${jsq(it.gkey)}')">
        ${esc(it.rem.documento)} · ${esc(it.gname)}
      </div>
    `).join("");
    cells += `<div class="cal-cell ${isToday ? "today" : ""}"><span class="cal-day-num">${d}</span>${itemsHtml}</div>`;
  }
  // completar até múltiplo de 7
  const totalCells = prevDaysToShow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    cells += `<div class="cal-cell other"><span class="cal-day-num">${i}</span></div>`;
  }
  return `
    <div class="modal cal-modal">
      <h3>📅 Calendário de Documentos</h3>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn btn-sm" onclick="calendarNav(-1)">‹</button>
          <span class="cal-month-label">${MESES_PT[m]} / ${y}</span>
          <button class="btn btn-sm" onclick="calendarNav(1)">›</button>
          <button class="btn btn-sm" onclick="calendarTodayNav()">Hoje</button>
        </div>
        <select class="col-filter" style="max-width:240px" onchange="onCalendarFilter('group', this.value)">
          <option value="">Todas as empresas/grupos</option>
          ${groupOptions}
        </select>
        <select class="col-filter" style="max-width:200px" onchange="onCalendarFilter('status', this.value)">
          <option value="">Todos os status</option>
          <option value="atrasado" ${calendarView.filterStatus === "atrasado" ? "selected" : ""}>⚠ Atrasado</option>
          <option value="proximo" ${calendarView.filterStatus === "proximo" ? "selected" : ""}>🕒 Próximo a solicitar</option>
          <option value="pendente" ${calendarView.filterStatus === "pendente" ? "selected" : ""}>Programado</option>
          <option value="solicitado" ${calendarView.filterStatus === "solicitado" ? "selected" : ""}>Solicitado</option>
          <option value="recebido" ${calendarView.filterStatus === "recebido" ? "selected" : ""}>Recebido</option>
        </select>
        ${(calendarView.filterGroup || calendarView.filterStatus) ? `<button class="btn btn-sm" onclick="calendarView.filterGroup='';calendarView.filterStatus='';refreshCalendar()">Limpar filtros</button>` : ""}
        <span style="margin-left:auto"><button class="btn" onclick="closeCalendarModal()">Fechar</button></span>
      </div>
      <div class="cal-grid">
        ${dow.map((d) => `<div class="cal-dow">${d}</div>`).join("")}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><span class="swatch" style="background:rgba(239,68,68,.4)"></span>Atrasado</span>
        <span><span class="swatch" style="background:rgba(245,158,11,.45)"></span>Próximo a solicitar</span>
        <span><span class="swatch" style="background:rgba(139,150,163,.35)"></span>Programado</span>
        <span><span class="swatch" style="background:rgba(79,195,232,.45)"></span>Solicitado</span>
        <span><span class="swatch" style="background:rgba(34,197,94,.45)"></span>Recebido</span>
      </div>
    </div>
  `;
}
function calendarGoToItem(gkey) {
  closeCalendarModal();
  view = { type: "group", key: gkey };
  activeTab = "lembretes";
  render();
}

/* =========================================================================
 * MENSAGENS (toast) E CONFIRMAÇÕES
 * ====================================================================== */

/** Exibe uma mensagem flutuante. tipo: "ok" | "erro" | "info" */
function notify(mensagem, tipo) {
  let host = document.getElementById("toast-host");
  if (!host) {
    host = document.createElement("div");
    host.id = "toast-host";
    host.className = "toast-host";
    document.body.appendChild(host);
  }
  const el = document.createElement("div");
  el.className = "toast toast-" + (tipo || "ok");
  el.textContent = mensagem;
  host.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 250); }, 2600);
}

/** Confirmação padrão de ações destrutivas. */
function confirmar(mensagem) { return window.confirm(mensagem); }

/** Cria (ou substitui) um modal na tela, retornando o elemento overlay. */
function openModal(id, innerHtml, onClose) {
  closeModal(id);
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = id;
  overlay.innerHTML = innerHtml;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) { closeModal(id); if (onClose) onClose(); } });
  document.body.appendChild(overlay);
  return overlay;
}
/** Fecha um modal pelo id. */
function closeModal(id) { const el = document.getElementById(id); if (el) el.remove(); }

/** Valor de um input do DOM, já com trim. */
function fieldValue(id) { const el = document.getElementById(id); return el ? String(el.value).trim() : ""; }

/** Normaliza nomes para comparação (sem acento, sem caixa, sem espaços extras). */
function normalizeName(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
}

/** Próximo id sequencial dos lançamentos. */
function nextRowId() { return rows.length ? Math.max(...rows.map((r) => r.id || 0)) + 1 : 1; }

/* =========================================================================
 * CADASTRO DE EMPRESAS (cadastrar / editar / excluir / pesquisar)
 * ====================================================================== */
let empresaSearch = "";

/** Retorna a empresa cadastrada com o nome informado (ignorando acentos/caixa). */
function findEmpresa(nome, ignoreId) {
  const n = normalizeName(nome);
  return empresasCadastro.find((e) => normalizeName(e.nome) === n && e.id !== ignoreId);
}

/** Garante que a empresa exista no cadastro (usado ao criar lançamentos). */
function ensureEmpresa(nome, grupo) {
  if (!nome) return null;
  const existente = findEmpresa(nome);
  if (existente) return existente;
  const nova = { id: "e" + Date.now() + Math.random().toString(36).slice(2, 6), nome, grupo: grupo || null, criadoEm: new Date().toISOString() };
  empresasCadastro.push(nova);
  return nova;
}

/** Cadastra uma nova empresa, impedindo duplicidade. */
function cadastrarEmpresa(nome, grupo) {
  nome = String(nome || "").trim();
  grupo = String(grupo || "").trim() || null;
  if (!nome) { notify("Informe o nome da empresa.", "erro"); return null; }
  if (findEmpresa(nome)) { notify("Já existe uma empresa com esse nome.", "erro"); return null; }
  const empresa = ensureEmpresa(nome, grupo);
  persist();
  notify("Empresa cadastrada.");
  return empresa;
}

/** Renomeia a empresa e propaga a alteração para todos os lançamentos. */
function editarEmpresa(id, nome, grupo) {
  nome = String(nome || "").trim();
  grupo = String(grupo || "").trim() || null;
  const empresa = empresasCadastro.find((e) => e.id === id);
  if (!empresa) return false;
  if (!nome) { notify("Informe o nome da empresa.", "erro"); return false; }
  if (findEmpresa(nome, id)) { notify("Já existe uma empresa com esse nome.", "erro"); return false; }
  const antigo = empresa.nome, antigoGrupo = empresa.grupo;
  empresa.nome = nome;
  empresa.grupo = grupo;
  rows.forEach((r) => {
    if (r.empresa === antigo) { r.empresa = nome; r.grupo = grupo; }
  });
  renameKeyEverywhere(antigoGrupo || antigo, grupo || nome);
  persist();
  notify("Empresa atualizada.");
  return true;
}

/** Move metadados (dashboard/histórico/arquivos) de uma chave para outra. */
function renameKeyEverywhere(oldKey, newKey) {
  if (!oldKey || !newKey || oldKey === newKey) return;
  const move = (obj) => { if (obj[oldKey] !== undefined) { obj[newKey] = obj[oldKey]; delete obj[oldKey]; } };
  [customLabels, customBadges, customDescriptions, reports, customTypes, accesses, historico, reminders, importacoes].forEach(move);
  if (pinned.has(oldKey)) { pinned.delete(oldKey); pinned.add(newKey); }
}

/** Exclui a empresa e, opcionalmente, todos os seus lançamentos. */
function excluirEmpresa(id) {
  const empresa = empresasCadastro.find((e) => e.id === id);
  if (!empresa) return;
  const qtd = rows.filter((r) => r.empresa === empresa.nome).length;
  if (!confirmar(`Excluir a empresa "${empresa.nome}"${qtd ? ` e seus ${qtd} lançamento(s)` : ""}?\n\nEsta ação não pode ser desfeita.`)) return;
  empresasCadastro = empresasCadastro.filter((e) => e.id !== id);
  rows = rows.filter((r) => r.empresa !== empresa.nome);
  const key = empresa.grupo || empresa.nome;
  if (!rows.some((r) => groupKey(r) === key)) purgeKey(key);
  persist();
  notify("Empresa excluída.");
  if (view.type === "group" && view.key === key) view = { type: "home" };
  openEmpresasManager();
  render();
}

/** Remove todos os metadados associados a uma chave de grupo/empresa. */
function purgeKey(key) {
  [customLabels, customBadges, customDescriptions, reports, customTypes, accesses, historico, reminders, importacoes]
    .forEach((obj) => { delete obj[key]; });
  pinned.delete(key);
}

  row.banco = fieldValue("er-banco");
  row.saldo_batendo = isoToBr(fieldValue("er-saldo"));

  row.data_envio = isoToBr(fieldValue("er-envio"));

}

/* =========================================================================
 * BACKUP: EXPORTAR / IMPORTAR / RESTAURAR / LIMPAR
 * ====================================================================== */

/** Baixa um arquivo JSON com todos os dados do sistema. */
function exportarJSON() {
  const dados = JSON.stringify(snapshotDb(), null, 2);
  const blob = new Blob([dados], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `conciliacoes-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify("Backup exportado.");
}

/** Importa um arquivo JSON gerado pela exportação. */
function importarJSON(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  if (!confirmar("Importar este arquivo irá SUBSTITUIR todos os dados atuais.\nUma cópia de segurança do estado atual será guardada.\n\nContinuar?")) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || typeof parsed !== "object") throw new Error("formato inválido");
      guardarBackupAtual();
      hydrate(parsed);
      persist();
      view = { type: "home" };
      document.documentElement.setAttribute("data-theme", settings.theme === "light" ? "light" : "dark");
      closeModal("settings-modal-overlay");
      render();
      notify("Backup importado com sucesso.");
    } catch (e) {
      notify("Arquivo inválido: não foi possível importar.", "erro");
    }
  };
  reader.readAsText(file);
}

/** Guarda uma cópia de segurança do estado atual (usada antes de ações destrutivas). */
function guardarBackupAtual() {
  try {
    localStorage.setItem(BACKUP_KEY, JSON.stringify({ criadoEm: new Date().toISOString(), dados: snapshotDb() }));
  } catch (e) {}
}

/** Restaura a última cópia de segurança automática. */
function restaurarBackup() {
  let backup = null;
  try { backup = JSON.parse(localStorage.getItem(BACKUP_KEY) || "null"); } catch (e) {}
  if (!backup || !backup.dados) { notify("Nenhuma cópia de segurança disponível.", "erro"); return; }
  const quando = formatDateTime ? formatDateTime(backup.criadoEm) : backup.criadoEm;
  if (!confirmar(`Restaurar a cópia de segurança de ${quando}?\nOs dados atuais serão substituídos.`)) return;
  hydrate(backup.dados);
  persist();
  view = { type: "home" };
  document.documentElement.setAttribute("data-theme", settings.theme === "light" ? "light" : "dark");
  closeModal("settings-modal-overlay");
  render();
  notify("Backup restaurado.");
}

/** Apaga TODO o conteúdo do sistema (com dupla confirmação). */
function limparSistema() {
  if (!confirmar("LIMPAR SISTEMA\n\nTodos os dados (empresas, lançamentos, histórico, lembretes, acessos e configurações) serão apagados.\n\nDeseja continuar?")) return;
  if (!confirmar("Confirma definitivamente? Uma cópia de segurança será guardada para restauração.")) return;
  guardarBackupAtual();
  hydrate(emptyDb());
  persist();
  view = { type: "home" };
  document.documentElement.setAttribute("data-theme", "dark");
  closeModal("settings-modal-overlay");
  render();
  notify("Sistema limpo.");
}

/** Exclui todo o histórico arquivado de um grupo/empresa. */
function limparHistorico(gkey) {
  const qtd = (historico[gkey] || []).length;
  if (!qtd) { notify("Não há histórico para excluir.", "info"); return; }
  if (!confirmar(`Excluir todos os ${qtd} registros do histórico deste grupo/empresa?`)) return;
  delete historico[gkey];
  persist();
  render();
  notify("Histórico excluído.");
}

/* =========================================================================
 * MÓDULO DE IMPORTAÇÕES (100% local, sem servidor / API / banco de dados)
 * Formatos: OFX, Excel (.xlsx/.xls) e CSV.
 * Os arquivos ficam salvos por empresa/grupo em db.importacoes[chave].
 * NADA é gravado antes da confirmação do usuário na pré-visualização.
 * ====================================================================== */

/** Campos que o sistema entende em um lançamento importado. */
const IMPORT_FIELDS = [
  { key: "data",       label: "Data",        obrigatorio: true },
  { key: "valor",      label: "Valor",       obrigatorio: true },
  { key: "descricao",  label: "Descrição" },
  { key: "tipo",       label: "Tipo" },
  { key: "documento",  label: "Documento" },
  { key: "cliente",    label: "Cliente" },
  { key: "fornecedor", label: "Fornecedor" },
];

/** Modelos prontos (Omie, Saipos) + Personalizado. Usados só como sugestão. */
const IMPORT_PRESETS = [
  {
    id: "omie", nome: "Omie",
    aliases: {
      data: ["data", "data de lancamento", "data lancamento", "data movimento", "dt lancamento"],
      valor: ["valor", "valor r$", "valor (r$)", "valor documento", "valor lancamento"],
      descricao: ["descricao", "observacao", "historico", "complemento"],
      tipo: ["tipo", "natureza", "tipo lancamento", "operacao"],
      documento: ["documento", "n documento", "numero documento", "nro documento", "num doc"],
      cliente: ["cliente", "nome cliente", "razao social cliente"],
      fornecedor: ["fornecedor", "nome fornecedor", "razao social fornecedor"],
    },
  },
  {
    id: "saipos", nome: "Saipos",
    aliases: {
      data: ["data movimento", "data", "dt lancamento", "data pagamento", "data competencia"],
      valor: ["valor", "valor total", "vl total", "total"],
      descricao: ["descricao", "observacoes", "observacao", "historico"],
      tipo: ["tipo", "tipo movimento", "movimento", "operacao", "entrada saida"],
      documento: ["documento", "n doc", "nro doc", "numero"],
      cliente: ["cliente", "nome cliente"],
      fornecedor: ["fornecedor", "nome fornecedor"],
    },
  },
  { id: "personalizado", nome: "Modelo personalizado", aliases: {} },
];

/** Pré-visualização em memória (nunca gravada até a confirmação). */
let importPreview = null;

function normHeader(s) {
  return String(s == null ? "" : s).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}

/** Converte diferentes formatos de data para ISO (yyyy-mm-dd). */
function parseImportDate(v) {
  if (v == null || v === "") return "";
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = (Number(y) > 60 ? "19" : "20") + y;
    return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`; // OFX
  if (/^\d+(\.\d+)?$/.test(s)) { // serial do Excel
    const n = Number(s);
    if (n > 20000 && n < 60000) {
      const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
      return d.toISOString().slice(0, 10);
    }
  }
  return "";
}

/** Converte valores em formato brasileiro/americano para número. */
function parseImportValor(v) {
  if (v == null || v === "") return 0;
  if (typeof v === "number") return v;
  let s = String(v).trim().replace(/\s/g, "").replace(/r\$/i, "");
  let neg = /^\(.*\)$/.test(s) || /-/.test(s) || /\bD$/i.test(s);
  s = s.replace(/[()CD]/gi, "").replace(/-/g, "");
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s.replace(/[^0-9.]/g, ""));
  if (isNaN(n)) return 0;
  return neg ? -Math.abs(n) : n;
}

function fmtImportMoney(n) {
  return (n < 0 ? "-" : "") + "R$ " + Math.abs(Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtImportDate(iso) {
  if (!iso) return "—";
  const p = String(iso).split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}

/** Calcula o resumo (quantidade, período, entradas, saídas, saldo). */
function computeImportResumo(lancs) {
  const datas = lancs.map((l) => l.data).filter(Boolean).sort();
  let entradas = 0, saidas = 0;
  lancs.forEach((l) => { const v = Number(l.valor) || 0; if (v >= 0) entradas += v; else saidas += v; });
  return {
    quantidade: lancs.length,
    dataInicial: datas[0] || "",
    dataFinal: datas[datas.length - 1] || "",
    entradas, saidas, saldo: entradas + saidas,
  };
}

// ---------- Parsers (executados no próprio navegador) ----------

/** CSV com detecção de delimitador e suporte a aspas. */
function parseCsvText(text) {
  text = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  const firstLine = text.split("\n")[0] || "";
  const delim = [";", ",", "\t", "|"].sort((a, b) => firstLine.split(b).length - firstLine.split(a).length)[0];
  const linhas = [];
  let campo = "", linha = [], aspas = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (aspas) {
      if (c === '"') { if (text[i + 1] === '"') { campo += '"'; i++; } else aspas = false; }
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === delim) { linha.push(campo); campo = ""; }
    else if (c === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  const validas = linhas.filter((l) => l.some((c) => String(c).trim() !== ""));
  if (!validas.length) return { headers: [], linhas: [] };
  return { headers: validas[0].map((h) => String(h).trim()), linhas: validas.slice(1) };
}

/** Excel via SheetJS (leitura local do arquivo). */
function parseExcelBuffer(buffer) {
  const wb = XLSX.read(new Uint8Array(buffer), { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false, blankrows: false });
  if (!matriz.length) return { headers: [], linhas: [] };
  const headerIdx = matriz.findIndex((l) => l.filter((c) => String(c).trim() !== "").length >= 2);
  const idx = headerIdx < 0 ? 0 : headerIdx;
  return { headers: (matriz[idx] || []).map((h) => String(h).trim()), linhas: matriz.slice(idx + 1) };
}

/** OFX (extrato bancário) — extrai as transações STMTTRN. */
function parseOfxText(text) {
  const tags = (bloco, tag) => {
    const m = bloco.match(new RegExp("<" + tag + ">([^<\\r\\n]*)", "i"));
    return m ? m[1].trim() : "";
  };
  const blocos = text.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/gi) || [];
  return blocos.map((b) => {
    const valor = parseFloat(String(tags(b, "TRNAMT")).replace(",", ".")) || 0;
    const memo = tags(b, "MEMO");
    const name = tags(b, "NAME");
    const tipo = tags(b, "TRNTYPE") || (valor >= 0 ? "CREDIT" : "DEBIT");
    return {
      data: parseImportDate(tags(b, "DTPOSTED")),
      valor,
      descricao: memo || name,
      tipo: tipo === "CREDIT" ? "Entrada" : tipo === "DEBIT" ? "Saída" : tipo,
      documento: tags(b, "CHECKNUM") || tags(b, "FITID"),
      cliente: valor >= 0 ? name : "",
      fornecedor: valor < 0 ? name : "",
    };
  });
}

/** Lê o arquivo escolhido e abre a pré-visualização (sem salvar nada). */
function onImportFile(ev, gkey, formato) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      if (formato === "excel") {
        const { headers, linhas } = parseExcelBuffer(e.target.result);
        abrirPreviewTabular(gkey, file.name, "excel", headers, linhas);
      } else if (formato === "csv") {
        const { headers, linhas } = parseCsvText(String(e.target.result));
        abrirPreviewTabular(gkey, file.name, "csv", headers, linhas);
      } else {
        const lancs = parseOfxText(String(e.target.result));
        if (!lancs.length) { notify("Nenhuma transação encontrada no OFX.", "erro"); return; }
        importPreview = { gkey, nome: file.name, formato: "ofx", headers: [], linhas: [], mapa: {}, lancamentos: lancs, modeloId: "" };
        renderImportPreviewModal();
      }
    } catch (err) {
      notify("Erro ao ler o arquivo: " + err.message, "erro");
    }
  };
  reader.onerror = () => notify("Não foi possível ler o arquivo.", "erro");
  if (formato === "excel") reader.readAsArrayBuffer(file);
  else reader.readAsText(file, "ISO-8859-1");
}

/** Prepara a pré-visualização de Excel/CSV com reconhecimento de modelo. */
function abrirPreviewTabular(gkey, nome, formato, headers, linhas) {
  if (!headers.length) { notify("Não foi possível identificar o cabeçalho do arquivo.", "erro"); return; }
  const assinatura = headers.map(normHeader).filter(Boolean).join("|");
  const salvo = importModels.find((m) => m.assinatura === assinatura);
  let mapa = {}, modeloId = "";
  if (salvo) { mapa = Object.assign({}, salvo.mapa); modeloId = "salvo:" + salvo.id; notify(`Modelo "${salvo.nome}" reconhecido automaticamente.`); }
  else { const auto = detectarMapa(headers); mapa = auto.mapa; modeloId = auto.presetId; }
  importPreview = { gkey, nome, formato, headers, linhas, assinatura, mapa, modeloId, lancamentos: [] };
  aplicarMapaPreview();
  renderImportPreviewModal();
}

/** Tenta casar os cabeçalhos com os modelos Omie/Saipos. */
function detectarMapa(headers) {
  let melhor = { presetId: "personalizado", mapa: {}, score: 0 };
  IMPORT_PRESETS.forEach((preset) => {
    if (!Object.keys(preset.aliases).length) return;
    const mapa = {}; let score = 0;
    IMPORT_FIELDS.forEach((f) => {
      const aliases = preset.aliases[f.key] || [];
      const idx = headers.findIndex((h) => aliases.includes(normHeader(h)));
      if (idx >= 0) { mapa[f.key] = String(idx); score++; }
    });
    if (score > melhor.score) melhor = { presetId: preset.id, mapa, score };
  });
  return melhor;
}

/** Converte as linhas brutas em lançamentos usando o mapeamento atual. */
function aplicarMapaPreview() {
  if (!importPreview || importPreview.formato === "ofx") return;
  const { linhas, mapa } = importPreview;
  const get = (linha, campo) => {
    const i = mapa[campo];
    if (i === undefined || i === "") return "";
    const v = Array.isArray(linha) ? linha[Number(i)] : "";
    return v == null ? "" : v;
  };
  importPreview.lancamentos = linhas.map((l) => {
    const valor = parseImportValor(get(l, "valor"));
    const tipoBruto = String(get(l, "tipo") || "").trim();
    const negativoPorTipo = /^(s|saida|saída|d|debito|débito|pagamento|despesa)/i.test(tipoBruto);
    return {
      data: parseImportDate(get(l, "data")),
      valor: negativoPorTipo ? -Math.abs(valor) : valor,
      descricao: String(get(l, "descricao") || "").trim(),
      tipo: tipoBruto || (valor >= 0 ? "Entrada" : "Saída"),
      documento: String(get(l, "documento") || "").trim(),
      cliente: String(get(l, "cliente") || "").trim(),
      fornecedor: String(get(l, "fornecedor") || "").trim(),
    };
  }).filter((l) => l.data || l.valor || l.descricao);
}

function onImportModeloChange(valor) {
  if (!importPreview) return;
  importPreview.modeloId = valor;
  if (valor.startsWith("salvo:")) {
    const m = importModels.find((x) => x.id === Number(valor.slice(6)));
    if (m) importPreview.mapa = Object.assign({}, m.mapa);
  } else {
    const preset = IMPORT_PRESETS.find((p) => p.id === valor);
    if (preset && Object.keys(preset.aliases).length) {
      const mapa = {};
      IMPORT_FIELDS.forEach((f) => {
        const aliases = preset.aliases[f.key] || [];
        const idx = importPreview.headers.findIndex((h) => aliases.includes(normHeader(h)));
        if (idx >= 0) mapa[f.key] = String(idx);
      });
      importPreview.mapa = mapa;
    } else importPreview.mapa = {};
  }
  aplicarMapaPreview();
  renderImportPreviewModal();
}

function onImportCampoChange(campo, valor) {
  if (!importPreview) return;
  importPreview.mapa[campo] = valor;
  aplicarMapaPreview();
  renderImportPreviewModal();
}

/** Monta/atualiza o modal de pré-visualização. */
function renderImportPreviewModal() {
  if (!importPreview) return;
  const p = importPreview;
  const resumo = computeImportResumo(p.lancamentos);
  const tabular = p.formato !== "ofx";
  const opcoesHeaders = (campo) => [`<option value="">— não usar —</option>`].concat(
    p.headers.map((h, i) => `<option value="${i}" ${String(p.mapa[campo]) === String(i) ? "selected" : ""}>${esc(h || "Coluna " + (i + 1))}</option>`)
  ).join("");

  const mapeamento = !tabular ? "" : `
    <div class="import-config">
      <label>Modelo de importação</label>
      <select onchange="onImportModeloChange(this.value)">
        ${IMPORT_PRESETS.map((m) => `<option value="${m.id}" ${p.modeloId === m.id ? "selected" : ""}>${esc(m.nome)}</option>`).join("")}
        ${importModels.map((m) => `<option value="salvo:${m.id}" ${p.modeloId === "salvo:" + m.id ? "selected" : ""}>💾 ${esc(m.nome)}</option>`).join("")}
      </select>
      <div class="import-map-grid">
        ${IMPORT_FIELDS.map((f) => `
          <div>
            <label>${f.label}${f.obrigatorio ? " *" : ""}</label>
            <select onchange="onImportCampoChange('${f.key}', this.value)">${opcoesHeaders(f.key)}</select>
          </div>`).join("")}
      </div>
      <label class="import-check">
        <input type="checkbox" id="imp-salvar-modelo" ${p.salvarModelo ? "checked" : ""} onchange="importPreview.salvarModelo = this.checked; document.getElementById('imp-nome-modelo').disabled = !this.checked;">
        Salvar este mapeamento como modelo (reconhecido automaticamente nas próximas importações)
      </label>
      <input type="text" id="imp-nome-modelo" placeholder="Nome do modelo" value="${esc(p.nomeModelo || p.nome.replace(/\.[^.]+$/, ""))}" ${p.salvarModelo ? "" : "disabled"}>
    </div>`;

  const amostra = p.lancamentos.slice(0, 20);
  const tabela = `
    <div class="table-wrap snapshot-table-wrap" style="margin-top:12px">
      <table>
        <thead><tr>${IMPORT_FIELDS.map((f) => `<th>${f.label}</th>`).join("")}</tr></thead>
        <tbody>
          ${amostra.length ? amostra.map((l) => `
            <tr>
              <td>${fmtImportDate(l.data)}</td>
              <td style="color:${l.valor < 0 ? "#F87171" : "#34D399"}">${fmtImportMoney(l.valor)}</td>
              <td>${esc(l.descricao)}</td>
              <td>${esc(l.tipo)}</td>
              <td>${esc(l.documento)}</td>
              <td>${esc(l.cliente)}</td>
              <td>${esc(l.fornecedor)}</td>
            </tr>`).join("") : `<tr><td colspan="7" style="text-align:center;padding:16px">Selecione ao menos as colunas de Data e Valor.</td></tr>`}
        </tbody>
      </table>
    </div>
    ${p.lancamentos.length > 20 ? `<div class="hint" style="margin-top:6px">Mostrando 20 de ${p.lancamentos.length} registros.</div>` : ""}`;

  const html = `
    <div class="modal modal-lg" style="width:920px;max-width:96vw">
      <h3>Pré-visualização — ${esc(p.nome)}</h3>
      <div class="import-resumo">
        <div><span class="k">Registros</span><strong>${resumo.quantidade}</strong></div>
        <div><span class="k">Data inicial</span><strong>${fmtImportDate(resumo.dataInicial)}</strong></div>
        <div><span class="k">Data final</span><strong>${fmtImportDate(resumo.dataFinal)}</strong></div>
        <div><span class="k">Entradas</span><strong style="color:#34D399">${fmtImportMoney(resumo.entradas)}</strong></div>
        <div><span class="k">Saídas</span><strong style="color:#F87171">${fmtImportMoney(resumo.saidas)}</strong></div>
        <div><span class="k">Saldo</span><strong>${fmtImportMoney(resumo.saldo)}</strong></div>
      </div>
      ${mapeamento}
      ${tabela}
      <div class="actions">
        <button class="btn" onclick="cancelarImportacao()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarImportacao()" ${resumo.quantidade ? "" : "disabled"}>Confirmar importação</button>
      </div>
    </div>`;
  const overlay = document.getElementById("import-preview-overlay");
  if (overlay) overlay.innerHTML = html;
  else openModal("import-preview-overlay", html, cancelarImportacao);
}

function cancelarImportacao() {
  importPreview = null;
  closeModal("import-preview-overlay");
}

/** Só aqui os dados são gravados — após confirmação explícita. */
function confirmarImportacao() {
  if (!importPreview) return;
  const p = importPreview;
  if (!p.lancamentos.length) { notify("Nada para importar.", "erro"); return; }
  const lista = importacoes[p.gkey] || [];
  const nextId = lista.length ? Math.max(...lista.map((x) => x.id)) + 1 : 1;
  lista.unshift({
    id: nextId,
    nome: p.nome,
    formato: p.formato,
    importadoEm: new Date().toLocaleString("pt-BR"),
    resumo: computeImportResumo(p.lancamentos),
    lancamentos: p.lancamentos,
  });
  importacoes[p.gkey] = lista;

  const chk = document.getElementById("imp-salvar-modelo");
  if (chk && chk.checked && p.assinatura) {
    const nome = (document.getElementById("imp-nome-modelo").value || p.nome).trim();
    const existente = importModels.find((m) => m.assinatura === p.assinatura);
    if (existente) { existente.nome = nome; existente.mapa = Object.assign({}, p.mapa); }
    else importModels.push({ id: Date.now(), nome, mapa: Object.assign({}, p.mapa), assinatura: p.assinatura });
  }

  persist();
  importPreview = null;
  closeModal("import-preview-overlay");
  render();
  notify("Importação concluída.");
}

/** Mostra os lançamentos já importados de um arquivo. */
function verImportacao(gkey, id) {
  const arq = (importacoes[gkey] || []).find((a) => a.id === id);
  if (!arq) return;
  const r = arq.resumo || {};
  openModal("import-view-overlay", `
    <div class="modal modal-lg" style="width:920px;max-width:96vw">
      <h3>${esc(arq.nome)}</h3>
      <div class="import-resumo">
        <div><span class="k">Registros</span><strong>${r.quantidade || 0}</strong></div>
        <div><span class="k">Data inicial</span><strong>${fmtImportDate(r.dataInicial)}</strong></div>
        <div><span class="k">Data final</span><strong>${fmtImportDate(r.dataFinal)}</strong></div>
        <div><span class="k">Entradas</span><strong style="color:#34D399">${fmtImportMoney(r.entradas || 0)}</strong></div>
        <div><span class="k">Saídas</span><strong style="color:#F87171">${fmtImportMoney(r.saidas || 0)}</strong></div>
        <div><span class="k">Saldo</span><strong>${fmtImportMoney(r.saldo || 0)}</strong></div>
      </div>
      <div class="table-wrap snapshot-table-wrap" style="margin-top:12px">
        <table>
          <thead><tr>${IMPORT_FIELDS.map((f) => `<th>${f.label}</th>`).join("")}</tr></thead>
          <tbody>
            ${(arq.lancamentos || []).map((l) => `
              <tr>
                <td>${fmtImportDate(l.data)}</td>
                <td style="color:${l.valor < 0 ? "#F87171" : "#34D399"}">${fmtImportMoney(l.valor)}</td>
                <td>${esc(l.descricao)}</td>
                <td>${esc(l.tipo)}</td>
                <td>${esc(l.documento)}</td>
                <td>${esc(l.cliente)}</td>
                <td>${esc(l.fornecedor)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="actions"><button class="btn" onclick="closeModal('import-view-overlay')">Fechar</button></div>
    </div>`);
}

function excluirImportacao(gkey, id) {
  const arq = (importacoes[gkey] || []).find((a) => a.id === id);
  if (!arq) return;
  if (!confirmar(`Excluir o arquivo importado "${arq.nome}"?\n\nEsta ação não pode ser desfeita.`)) return;
  importacoes[gkey] = (importacoes[gkey] || []).filter((a) => a.id !== id);
  persist();
  render();
  notify("Arquivo excluído.");
}

// ---------- init ----------

document.addEventListener("click", (e) => {
  if (openStatusId !== null && !e.target.closest(".status-dropdown-wrap")) {
    openStatusId = null;
    render();
  }
});
loadAll();
document.documentElement.setAttribute("data-theme", settings.theme === "light" ? "light" : "dark");
render();
</script>
