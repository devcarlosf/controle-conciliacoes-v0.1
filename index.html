<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Finance Manager: controle de conciliações, importações, lembretes e bater saldo — 100% local no navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="fm-shell" id="fm-shell">
  <div class="fm-backdrop" onclick="toggleSidebar(false)"></div>

      <div class="fm-brand-text">

      <button class="fm-nav-item" data-nav="painel" onclick="navigate('painel')"><span class="fm-nav-ico">📊</span> Dashboard</button>
      <button class="fm-nav-item" data-nav="empresas" onclick="navigate('empresas')"><span class="fm-nav-ico">🏢</span> Empresas / Grupos</button>
      <button class="fm-nav-item" data-nav="baterSaldo" onclick="navigate('baterSaldo')"><span class="fm-nav-ico">⚖️</span> Bater Saldo <span class="fm-nav-tag">Novo</span></button>

      <div class="fm-nav-label">Ferramentas</div>

      <button class="fm-nav-item" onclick="navigate('configuracoes')"><span class="fm-nav-ico">⚙️</span> Configurações</button>
    </nav>

    <div class="fm-sidebar-foot">
      <button class="btn btn-sm" onclick="toggleTheme()" title="Alternar tema">🌗 Alternar tema</button>
      <div class="save-indicator" id="save-indicator-side"></div>
    </div>
  </aside>

  <!-- ===== Conteúdo ===== -->
  <main class="fm-main">
    <div class="fm-topbar">
      <button class="fm-menu-btn" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
      <strong style="font-size:14px">Finance Manager</strong>

    <div class="wrap" id="app"></div>

<!-- ===== Núcleo ===== -->
<script src="js/database.js"></script>
